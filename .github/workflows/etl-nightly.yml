name: Nightly data refresh

on:
  schedule:
    # 04:30 UTC every day (05:30 BST, 04:30 GMT in winter)
    - cron: "30 4 * * *"
    # And 07:30 UTC (08:30 BST, 07:30 GMT): ONS and OBR publish at 07:00 UK time, so a release reaches its data
    # pull request the same morning. Every run updates the one standing data branch and pull request.
    - cron: "30 7 * * *"
  workflow_dispatch:

permissions:
  # actions: start CI on the data branch (below).
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: etl-nightly
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      # Fetch every source, normalise, check. A balance, coverage or staleness error fails the run.
      - run: python -m etl.build --trigger nightly
      # Contracts linked to promises (M6b): a changed value or end date appends a snapshot.
      - run: python -m etl.contracts
      # Forecasts against outturn (M7): record any new forecast the site now shows, and score every one whose
      # outturn is out. Its files change only when a new edition brings forecasts or outturn, so most nights it does nothing.
      - run: python -m etl.backtest
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 22's bundled Corepack cannot run pnpm 12; use the version that works locally.
      - run: npm install -g corepack@0.34.5 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      # Make silence visible: append deadline_missed events to overdue cards.
      - run: pnpm deadlines
      - run: pnpm test
      - run: pnpm validate -- --base origin/main
      - name: Open a pull request when the data changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The run log and manifest change every night; only a change in the data itself opens a PR.
          if [ -z "$(git status --porcelain -- data/build/observations data/build/statements data/build/app.json data/build/levers.json data/build/tax.json data/build/people.json data/build/contracts data/build/forecasts data/build/backtest.json data/build/borrowing.json data/build/fiscal_targets.json content/promises)" ]; then
            echo "No data changes."
            exit 0
          fi
          # One standing branch and pull request: each run rebuilds it from main as it is now, so the newest data
          # replaces the last night's instead of opening another pull request (and another Vercel preview).
          # Merging it (and deleting the branch) lets the next change open a fresh one.
          branch="data/refresh"
          today=$(date -u +%Y-%m-%d)
          title="Data refresh (latest $today)"
          git config user.name "public-ledger-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/build content/promises
          git commit -m "Data refresh $today"
          # Only the bot's own data branch is overwritten, never main.
          git push --force origin "HEAD:refs/heads/$branch"
          summary=$(python -m etl.summary)
          num=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh pr edit "$num" --title "$title" --body "$summary"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$summary"
          fi
          # A pull request opened with this token starts no workflows: start CI on the branch so its checks show on the
          # pull request (on 22 Nov 2026 a refresh with new ONS data was merged unchecked and broke the borrowing tests).
          gh workflow run ci.yml --ref "$branch"
