name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 22's bundled Corepack cannot run pnpm 12; use the version that works locally.
      - run: npm install -g corepack@0.34.5 && corepack enable pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      # Promise history is append-only: compare every published card with main.
      - run: pnpm validate -- --base origin/main
      # The OpenPromises engine's check (docs/OPERATIONS.md §15), blocking since the switch on 12 October 2026:
      # every card in format v1, two editors' approvals, a quality label on every cost, history against the base.
      # The editors list is private (OpenPromises decision 10): it comes from a secret, never the repository.
      # A fork's pull request gets no secrets, so there the check runs as a report and an editor's branch runs it in full.
      - name: OpenPromises check
        env:
          EDITORS_YAML: ${{ secrets.OPENPROMISES_EDITORS }}
        run: |
          if [ -n "$EDITORS_YAML" ]; then
            printf '%s\n' "$EDITORS_YAML" > "$RUNNER_TEMP/editors.yaml"
            export OPENPROMISES_EDITORS="$RUNNER_TEMP/editors.yaml"
            pnpm exec openpromises validate
          else
            echo "::warning::No editors list here (a fork's pull request gets no secrets): the OpenPromises check runs as a report only."
            pnpm exec openpromises validate || true
          fi
      - run: pnpm typecheck
      # The verification labels need the editors list at build time (docs/OPERATIONS.md §15); a fork's pull request
      # gets an empty secret, and the build falls back to the wording without labels.
      - run: pnpm build
        env:
          OPENPROMISES_EDITORS_YAML: ${{ secrets.OPENPROMISES_EDITORS }}

  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: etl/requirements.txt
      - run: pip install -r etl/requirements.txt
      # Network-free: recorded fixtures (the Internet Archive fallback) and committed data; tests that need downloads skip.
      - run: python -m pytest etl/tests -q --offline
      # Rebuild from the committed observations: balance, coverage and staleness checks fail the job.
      - run: python -m etl.build --offline --trigger ci
      # Forecast records and the backtest table (M7): a new edition merged without running the job shows up here.
      - run: python -m etl.backtest
      - name: Committed build output is up to date
        run: git diff --exit-code -- data/build/app.json data/build/statements data/build/levers.json data/build/tax.json data/build/people.json data/build/forecasts data/build/backtest.json data/build/borrowing.json data/build/fiscal_targets.json
