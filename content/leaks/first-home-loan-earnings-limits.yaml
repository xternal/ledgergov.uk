id: first-home-loan-earnings-limits
headline: Cap earnings for the first-time buyer loan scheme
area: housing_env
summary: >-
  BBC News, following a report first published by The Times, says the Budget is expected to confirm
  that households must earn under £110,000 (or £140,000 for homes in London) to qualify for the
  government's Your First Home scheme of equity loans worth 20% of a new-build home in England. The
  Times reported that ministers first planned lower limits of £90,000 and £110,000. The report gives no
  cost and says the scheme is to be funded from existing budgets.
reported:
