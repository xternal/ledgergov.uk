    basis: per_year
    period: "2027-28"
    by: { kind: official, name: HM Treasury }
    source_url: https://assets.publishing.service.gov.uk/media/6ae20b85460c1346f7be784e/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=110
    note: "Table 6.1 line 55, the year of the largest figure; £305m in 2026-27, £950m in 2027-28 and £220m in 2028-29, then nothing."
