id: state-lenders-capital-20bn
headline: Add £20.4bn of capital to two state-backed lenders
area: economic_affairs
summary: >-
  Reuters, following a Financial Times report, says the Chancellor is expected to announce about
  £20.4bn of extra capital for two state-backed lenders in the Budget: £15.4bn more for the National
  Wealth Fund and £5bn more for the British Business Bank, spread over roughly five years. The
  Treasury confirmed the figures in an emailed statement and says the money could support about
  100,000 jobs by 2035. The report does not say how much of this would count towards borrowing.
