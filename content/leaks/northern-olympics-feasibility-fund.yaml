id: northern-olympics-feasibility-fund
headline: Fund a £7m study of a northern Olympics bid
area: culture
summary: >-
  The Guardian reports that the Chancellor will announce a £7m fund in the Budget for a full
  feasibility study of a bid to host the Olympic and Paralympic Games in the north of England in the
  2040s, covering venues, transport, likely cost and the chances of winning. The Chancellor and the
  Prime Minister are quoted on the record backing it.
