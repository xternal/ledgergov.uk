id: mayors-borrowing-and-growth-funding
headline: Give English mayors a £1.5bn borrowing facility and growth funding
area: economic_affairs
summary: >-
  Reuters and the Guardian report that the Budget will give mayors and local leaders in England new
  money and powers: a £1.5bn borrowing facility to be designed with mayors over the next two years,
  £285m of "good growth" seed funding next year for local priorities such as housing, transport or
  high streets, and £150m to help local authorities build staff and expertise. The Treasury described
  the scheme on the record, and the Prime Minister and the Chancellor are quoted backing it. The
  reports give no yearly cost for the borrowing facility.
