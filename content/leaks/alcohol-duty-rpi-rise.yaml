id: alcohol-duty-rpi-rise
headline: Raise alcohol duty in line with RPI inflation
area: taxes
summary: >-
  The Telegraph reports that the Chancellor is expected to raise alcohol duty in line with RPI
  inflation of 3.9%, which it says would take the duty on a pint from 50p to 52p and add about 10p to
  12p to a bottle of wine and 35p to a bottle of gin. The report does not say who briefed it. The
  Treasury did not comment, saying decisions on tax are for the Chancellor to set out at fiscal events.
