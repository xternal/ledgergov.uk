id: defence-spending-increase
headline: Add billions of pounds of new defence spending
area: defence
summary: >-
  BBC News, citing a Sunday Times report, says the Chancellor is expected to set out billions of pounds
  of new defence spending in the Budget, with the details of the money left to next year's spending
  review. The Guardian reported the day before that the Chancellor will set out how to fully fund the
  four-year defence investment plan, and that a commitment to spend 3% of GDP on defence is likely to
  wait for the spending review. On 26 October the Prime Minister said on ITV's Good Morning Britain,
  as reported by Reuters, that the Budget would set out a fully funded plan for existing defence
  commitments; asked whether it would include a path to 3% of GDP by 2030 and 3.5% by 2035, he said
  the government would set out a plan. None of the reports gives a figure.
