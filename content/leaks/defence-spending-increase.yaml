confirmed:
  date: "2026-10-26"
  by: Andy Burnham, Prime Minister (interview on ITV's Good Morning Britain, reported by Reuters)
  url: https://www.globalbankingandfinance.com/uk-set-out-path-nato-spending-target-wednesdays-budget/
  text: The Prime Minister said the Budget would set out a funded plan for existing defence commitments, saying "We will meet our NATO commitments."
