id: business-asset-disposal-relief-restricted
headline: Restrict the capital gains relief for selling a business
area: taxes
summary: >-
  The Telegraph reports that the Chancellor plans to raise taxes on business owners who sell up
  when they retire, by significantly restricting business asset disposal relief, which lowers the
  capital gains tax due on the sale of a qualifying business. The savings could go towards lower
  capital gains tax rates or more generous reliefs for entrepreneurs who create jobs.
reported:
  - outlet: The Telegraph
    date: "2026-10-22"
    url: https://www.telegraph.co.uk/business/2026/10/22/healey-to-raise-taxes-on-retiring-entrepreneurs/
    title: Healey to raise taxes on retiring entrepreneurs
status: trailed
