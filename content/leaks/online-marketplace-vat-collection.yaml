id: online-marketplace-vat-collection
headline: Make online marketplaces collect VAT for their sellers
area: taxes
summary: >-
  The Times reports that the Chancellor is expected to make online marketplaces such as Amazon, eBay
  and Temu collect VAT at source for business sellers with turnover above £90,000, with the money
  going towards business rates cuts for high street shops. The Treasury declined to comment.
