id: online-marketplace-vat-collection
headline: Make online marketplaces collect VAT for their sellers
area: taxes
summary: >-
  The Times reports that the Chancellor is expected to make online marketplaces such as Amazon, eBay
  and Temu collect VAT at source for business sellers with turnover above £90,000, with the money
  going towards business rates cuts for high street shops. The Treasury declined to comment.
reported:
  - outlet: The Times
    date: "2026-10-13"
    url: https://www.thetimes.com/uk/politics/article/amazon-ebay-temu-vat-tax-high-street-d5btx6qbt
    archived_url: https://web.archive.org/web/20261020082737/https://www.thetimes.com/uk/politics/article/amazon-ebay-temu-vat-tax-high-street-d5btx6qbt
status: announced
budget:
  date: "2026-10-28"
  text: >-
    From October 2027 online marketplaces collect the VAT on sales by UK VAT-registered businesses and by other UK businesses selling at least £90,000 a year on a platform (paragraph 6.154; table of policy decisions, line 46).
  evidence_url: https://assets.publishing.service.gov.uk/media/6ae20b85460c1346f7be784e/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=130
  cost:
    range: [-0.32, -0.32, -0.32]
    basis: per_year
    period: "2028-29"
    by: { kind: official, name: HM Treasury }
    source_url: https://assets.publishing.service.gov.uk/media/6ae20b85460c1346f7be784e/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=109
    note: "Table 6.1 line 46, the year of the largest figure; it raises £165m in 2027-28, £320m in 2028-29 and £250m to £270m a year after."
