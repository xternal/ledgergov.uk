id: rough-sleeping-funding-432m
headline: Add £432m to the plan to end rough sleeping
area: housing_env
summary: >-
  The Prime Minister and the Chancellor said the government will add £432m to its rough sleeping
  programme, taking it from £442m to £874m and extending it beyond March 2027 to the end of this
  Parliament, with the aim of offering everyone sleeping rough in England a route off the street by
  Christmas. The Guardian, BBC News and Reuters reported it on 25 October; the Downing Street release
  says the money will be set out in the Budget.
