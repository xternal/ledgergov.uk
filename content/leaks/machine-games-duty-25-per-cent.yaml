id: machine-games-duty-25-per-cent
headline: Raise machine games duty from 20% to 25%
area: taxes
summary: >-
  The Racing Post, citing a report in The Times on 21 October, says the Treasury is understood to
  be looking at raising machine games duty, the tax on gaming machines such as those in betting
  shops, from 20% to 25% in the Budget, rather than to the 40% the Social Market Foundation
  proposed. The report does not name who briefed The Times or give a cost.
