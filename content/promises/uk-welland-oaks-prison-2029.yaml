status_note:
  en: >-
    HMP Welland Oaks is a category B prison for adult men under construction in Market Harborough,
    Leicestershire, built by Wates Construction. The Ministry of Justice says its final building
    beam has been installed and that, as of September 2026, 501 jobs had been created on site and
    £269 million, 85.5% of project spend, had gone to businesses within 50 miles. "The start of
    2029" is read as by 31 March 2029. It counts towards the 14,000 prison places due by 2031. The
    card moves when the prison receives its first prisoners.
