status_note:
  en: >-
    Both parts are now law. Supplying single-use vapes has been an offence in England since 1 June
    2025, under regulations made on 25 November 2024; Scotland, Wales and Northern Ireland made
    regulations of their own. The Tobacco and Vapes Act 2026, law since 29 April 2026, gives
    ministers powers over the flavour of vapes (section 96), their retail packaging (section 94) and
    how they are displayed in shops in England (section 13). Both came into law under the government
    that followed his.
