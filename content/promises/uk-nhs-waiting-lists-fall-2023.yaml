status_note:
  en: >-
    The pledge gives no date or figure. NHS England counted 7.21 million patients waiting for
    planned hospital treatment in England at the end of October 2022, the latest figure when it was
    made, and 7.6 million waiting-list pathways (about 6.4 million people) at the end of June 2024,
    the last full month before Rishi Sunak left office on 5 July 2024. Without a date the card
    cannot be marked met or not met, so it stays at Promised. No body in power is committed to it
    as worded; the present government's commitment is on waiting times (card uk-nhs-18-weeks-2024).
