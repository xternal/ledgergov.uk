  en: >-
    Young adults who lack the mental capacity to manage their money can reach their Child Trust Fund
    savings only through the Court of Protection, a complex and often costly process. The Ministry
    of Justice says new legislation will let parents and carers go directly to Child Trust Fund
    providers, helping an estimated 63,000 to 126,000 young adults; the justice minister's written
    statement announces the same plan. No Bill or date is named. The card moves when the legislation
    is introduced.
