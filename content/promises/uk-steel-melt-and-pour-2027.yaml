status_note:
  en: >-
    The statement, made in the Commons on behalf of the Minister of State for Trade, Lord Sarwar,
    says importers will have to declare the country where their steel was first melted and poured
    and keep evidence for HM Revenue and Customs. It is for data gathering and does not itself
    change tariffs, quotas or rules of origin; consignments under £2,000 are exempt. The card moves
    when the reporting rules are in force.
