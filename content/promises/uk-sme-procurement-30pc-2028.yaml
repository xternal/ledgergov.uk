status_note:
  en: >-
    Under the National Procurement Policy Statement, every department must set a three-year target
    for direct spending with small and medium-sized enterprises (SMEs) from 1 April 2025 and publish
    progress each year. The Cabinet Office set 30% by the end of 2027/28 and calls it a challenging
    target; HM Treasury set 22%. The card moves on the Cabinet Office's annual progress report.
