versions:
  - version: 1
    text: >-
      End the cliff edge within Carer’s Allowance, which sees carers lose £86.45 per week for a 1p
      increase in earnings above the weekly limit. Instead, earnings above the Weekly Earnings Limit
      will be subject to a 100% taper, where support is only reduced by £1 for each £1 increase in
      earnings. This means carers are no longer left financially worse off for working additional
      hours or receiving a pay rise. The taper will begin within 2030-31 once the Department for
      Work and Pensions have developed a new IT system to implement the taper.
