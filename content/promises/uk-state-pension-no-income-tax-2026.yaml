status_note:
  en: >-
    Answering a question after his statement on the triple lock, the Work and Pensions Secretary
    said the Prime Minister and Chancellor have made clear that people purely reliant on the basic
    state pension for their income will not have to pay income tax for the duration of this
    Parliament. The MP who asked said the government had said this more than once. He said the
    Chancellor will announce further details at the Budget; the source gives no Budget date and no
    date for the end of the Parliament, so the card has no deadline. The card moves when the Budget
    sets out the details.
