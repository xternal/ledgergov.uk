id: uk-send-inclusion-standards-2026
headline:
  en: Publish national inclusion standards for SEND
actor_id: lucy-powell
made_on: "2026-09-09"
venue: parliament
venue_label:
  en: Commons statement
area: education
status: promised
status_note:
  en: >-
    No date was given: the standards are to be published alongside any SEND legislation or further
    steps, and in the same statement Lucy Powell said the government will introduce SEND legislation
    "in due course". The schools white paper Every child achieving and thriving (23 February 2026)
    sets out National Inclusion Standards and says they should guide how schools meet children's
    needs by 2028.
