venue: press_release
venue_label:
  en: "Press release on the Plan for Change milestones (Prime Minister's Office)"
area: economic_affairs
status: delivering
status_note:
  en: >-
    The Department for Energy Security and Net Zero set out the path in its Clean Power 2030 Action
    Plan on 13 December 2024. On 14 January 2026 the seventh Contracts for Difference auction
    offered contracts to new offshore wind farms due to start generating between 2028/29 and
    2030/31. The Energy Secretary said on 14 October 2026 that almost two-thirds of Britain's
    electricity came from clean power over 2025, and planning policy published on 29 September 2026
    still names clean power by 2030. The deadline is taken as the end of 2030; the official figures
    for 2030 will settle it.
