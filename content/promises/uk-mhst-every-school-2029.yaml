format: openpromises/1
id: uk-mhst-every-school-2029
headline:
  en: Put mental health support teams in every school
actor_id: hm-government
made_on: "2025-05-08"
venue: parliament
venue_label:
  en: Written answer by Health minister Stephen Kinnock
area: health
status: delivering
status_note:
  en: >-
    In 2025-26, 5.8 million pupils and learners (60%) were covered by a mental health support team,
    and 11,800 schools and colleges (48%); the Department for Education projects 66% of pupils and 53%
    of schools and colleges by 31 March 2027 (data release, 10 June 2026). The deadline was first
    2029/30 (to March 2030) and since October 2025 has been "by 2029", which the Department for
    Education reads as the end of 2029. The Spending Review 2025 names the expansion in the health
    settlement but gives no separate figure; Labour's 2024 manifesto promised mental health
    professionals in every school and costed it at £175m in 2028-29 (a party figure). The teams began
    under the previous government in 2018.
