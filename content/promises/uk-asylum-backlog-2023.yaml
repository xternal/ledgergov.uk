status: failed
status_note:
  en: >-
    Home Office statistics show 95,252 asylum cases (128,786 people) still awaiting an initial
    decision at the end of December 2023, 28% fewer than a year earlier. The Home Office describes
    the pledge as one to clear the "legacy" backlog of claims made before 28 June 2022, and on 2
    January 2024 said that target had been met, with every legacy case reviewed and about 4,500
    complex cases needing further checks; its statistics put the legacy cases still awaiting an
    initial decision at 3,902 at the end of 2023. On either count the backlog was not abolished by
    the end of 2023, so the card reads Not met.
