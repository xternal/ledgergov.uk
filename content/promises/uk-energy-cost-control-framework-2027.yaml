format: openpromises/1
id: uk-energy-cost-control-framework-2027
headline:
  en: Introduce a cost control framework for energy bills
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: economic_affairs
status: promised
status_note:
  en: >-
    The Budget document says the government will introduce a comprehensive Cost Control Framework
    "at the spending review in 2027", setting budgets for components of energy costs, including
    policy costs (para 6.28), and that no new policy costs will be put on bills until it is in place
    (page 9). The second part of the quote is already done: the Budget drops the Gas Shipper
    Obligation levy and funds hydrogen contracts from DESNZ's budget instead (para 6.27). The card
    moves when the framework is published.
