id: uk-bus-cap-2-2026
headline:
  en: Cap bus fares at £2
actor_id: andy-burnham
made_on: "2026-07-22"
venue: press_release
venue_label:
  en: Government announcement
area: economic_affairs
status: funded
status_note:
  en: >-
    The Budget 2026 policy decisions table funds the cap (Table 6.1, line 4): single fares capped at
    £2 in England outside London for one year from 1 January 2027, funded by reprioritising DESNZ
    budgets. The table shows the net effect on borrowing, £50m in 2026-27 and £180m in 2027-28,
    followed by savings of £65m and £170m in the next two years as the reprioritised money comes
    back; it does not restate the £400m. Earlier caps for context: a £2 cap ran in England outside
    London from January 2023 under the previous government; it rose to £3 in January 2025, and
    Spending Review 2025 extended the £3 cap to March 2027.
