  en: Written ministerial statement
area: housing_env
status: promised
status_note:
  en: >-
    The minister has tabled an amendment to the Social Housing Bill giving the government a power to
    say when a council may not refer a homeless household to another council for lack of a local
    connection; this is how the government means to use it. The housing release of 20 October says
    the same for councils in England. No date is given. The card moves when the Bill becomes law and
    the power is used.
