status_note:
  en: >-
    Young people aged 18 to 24 on Universal Credit and looking for work are now referred to the Jobs
    Guarantee after 18 months out of work; the release says this falls to 12 months from April 2027,
    read as by 30 April 2027. From the same month, those receiving the health element of Universal
    Credit can take part voluntarily, as announced in September. The card moves when the change
    takes effect.
