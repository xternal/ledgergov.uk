headline:
  en: "Ban leasehold for new flats and houses"
actor_id: hm-government
made_on: "2026-11-19"
venue: press_release
venue_label:
  en: >-
    Government response: Moving to commonhold: banning leasehold for new flats
area: housing_env
status: promised
status_note:
  en: >-
    The response says the ban on new leasehold houses will start at the same time, and developers
    who applied for or got planning permission before the ban may still sell leasehold flats on
    those sites. The Commonhold and Leasehold Reform Bill was introduced on 19 November 2026; an
    implementation roadmap is promised closer to Royal Assent. "Approximately 2031" is read as the
    end of 2031. The card moves when the Bill passes and the ban is commenced.
