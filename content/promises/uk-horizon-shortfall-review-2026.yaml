status_note:
  en: >-
    Sir Gary Hickinbottom recommended in May 2026 that a Post Office decision that there is too
    little evidence for a Horizon Shortfall Scheme fixed sum offer should be independently reviewed
    before a claim is rejected; the government and the Post Office accepted it. The Department for
    Business, Innovation, Science and Trade's release says the review will begin later this month.
    "Late October" is read as 31 October 2026. The card moves when the government confirms the
    review has started.
