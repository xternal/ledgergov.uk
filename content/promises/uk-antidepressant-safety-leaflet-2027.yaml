id: uk-antidepressant-safety-leaflet-2027
headline:
  en: Give antidepressant patients a safety leaflet in 2027
actor_id: hm-government
made_on: "2026-10-15"
venue: press_release
venue_label:
  en: Press release (Medicines and Healthcare products Regulatory Agency)
area: health
status: promised
status_note:
  en: >-
    The leaflet follows a review, started by the Commission on Human Medicines, of how leaflets
    explain the risks of suicidal thoughts and behaviours and of sexual dysfunction that continues
    after treatment stops. The same release says patient information leaflets will carry a new boxed
    warning and, for certain antidepressants, the term Post SSRI Sexual Dysfunction. 2027 is read as
    the end of 2027. The card moves when the leaflet is published.
