versions:
  - version: 1
    text: >-
      Finally, a supporting safety (ancillary) leaflet is being developed by the MHRA with the wider
      healthcare system, which will be given to patients at their first appointment discussing
      antidepressants. It will describe the key risks and benefits to support informed decision
      making about their treatment. This safety leaflet will also be given to patients who are
      already receiving antidepressants. This will be available in 2027.
