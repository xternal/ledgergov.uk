format: openpromises/1
id: uk-experts-at-hand-2029
headline:
  en: Invest £1.8bn in specialist SEND support
actor_id: bridget-phillipson
made_on: "2026-02-23"
venue: parliament
venue_label:
  en: "Commons statement: Schools White Paper"
area: education
status: funded
status_note:
  en: >-
    The schools white paper (23 February 2026) plans £1.8bn over the three spending review years,
    2026-27 to 2028-29: £1bn for professionals working directly with mainstream schools and £800m
    to expand outreach from specialist settings. The Department for Education allocated £429m to
    councils for 2026-27 and paid it at the end of June 2026, with about £750m and £850m indicated
    for the next two years (these yearly grants also carry a share of a separate £200m transformation
    fund). Delivery was due to start in September 2026; the card moves to Delivering when an official
    source shows teams working in schools. The Department of Health and Social Care restated the
    commitment on 9 October 2026.
