status_note:
  en: >-
    The banking surcharge is a tax on banks' profits above £100 million, on top of Corporation Tax.
    The paper says the higher rate will help fund measures to ease pressures on working people and
    families, and that it is time-limited. It is in the Finance Bill 2026-27. The card moves when
    the Bill becomes law, and again when the rate returns to 3% on 1 April 2028.
