status_note:
  en: >-
    The Department for Education says the new National Curriculum, developed by subject experts, is
    due to be published in full later this year, read as by 31 December 2026. It will slim down
    content, restore Key Stage 3 as a distinct three-year phase, and say that schools should not
    start GCSE courses early for large groups of pupils. The release gives no cost and does not say
    when schools start teaching it. The card moves when the curriculum is published.
