headline:
  en: "Limit landlords' legal cost recovery"
actor_id: matthew-pennycook
made_on: "2026-11-12"
venue: parliament
venue_label:
  en: >-
    Written ministerial statement
area: housing_env
status: promised
status_note:
  en: >-
    Landlords will in most cases need court or tribunal approval before recovering their litigation
    costs through a service or administration charge, and leaseholders get a new right to recover
    their own litigation costs from their landlord, with approval. Lower-value costs recovered
    through an administration charge are exempt. A further statutory instrument on litigation costs
    is to be laid later this year and come into force at the same time. The card moves when the
    regulations are in force.
