status_note:
  en: >-
    Making Tax Digital for Income Tax requires sole traders and landlords to send quarterly updates
    to HMRC through recognised software. It became mandatory for those earning more than £50,000
    from 6 April 2026; the press release confirms the next two steps, to £30,000 and then £20,000.
    The card moves when the £30,000 threshold takes effect in April 2027.
