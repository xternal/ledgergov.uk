headline:
  en: Shorter wait before councils take over empty homes
actor_id: matthew-pennycook
made_on: "2026-10-12"
venue: parliament
venue_label:
  en: Written ministerial statement
area: housing_env
status: legislated
status_note:
  en: >-
    Announced on 27 September 2026. An Empty Dwelling Management Order lets a council manage a
    long-term empty home and bring it back into use for up to seven years, while the owner keeps it.
    An order made on 14 October 2026 (SI 2026/1085) cuts how long a home must be empty before a
    tribunal can authorise one from two years to six months. It also removes the requirements for the
    council to give the tribunal any information suggesting the home causes a nuisance for the
    community, or that the community supports the order. It comes into force on 5 November 2026 and
    applies to applications made from that day. The card moves to Delivered once it is in force.
