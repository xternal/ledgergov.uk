status_note:
  en: >-
    The minister said the revised statutory guidance will come into effect from September 2027, read
    as by 30 September 2027, and encouraged schools to move sooner. Schools can still choose how:
    collecting phones at the start of the day, secure lockers, lockable pouches or another way that
    keeps phones out of reach, with reasonable adjustments and exemptions, including for pupils with
    medical needs and those with special educational needs and disabilities. The statement gives no
    cost. The card moves when the revised guidance is published.
