  en: >-
    The rules were laid before Parliament on 22 October 2026. The release says judges could impose
    loss of prison privileges for up to 84 days, among other sanctions, on offenders who refuse to
    attend their sentencing. It says the measures will take effect next year after the usual
    parliamentary process, read here as by 31 December 2027. The card moves when the rules come into
    force.
