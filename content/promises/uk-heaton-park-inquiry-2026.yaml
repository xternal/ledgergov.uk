  en: >-
    Two men were killed and three others seriously injured in the terror attack at Heaton Park
    synagogue on Yom Kippur in October 2025. The Home Secretary said the inquiry,
    requested by the coroner, will let all evidence be heard, including sensitive national security
    material that the coroner's court could not fully hear. No chair, terms of reference or timetable
    has been announced.
