versions:
  - version: 1
    text: >-
      I am pleased to announce that the basic and full rate of the new State Pensions will be
      increased by 3.9%, in line with the increase in average weekly earnings in the year to
      May-July 2026.

      This delivers on our Triple Lock commitment throughout this Parliament to increase these rates
      in line with the highest of growth in prices, growth in earnings or 2.5%. From April, the full
      annual rate of the new State Pension will increase by around £490.
