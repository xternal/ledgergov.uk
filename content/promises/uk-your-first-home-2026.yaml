          en: >-
            Year shown: 2028-29, the first full year. The Budget lends a fixed £1bn a year in equity
            loans from 2028-29, after £700m in 2027-28, £4.7bn in all to 2031-32 (Table 6.2, line
            5); part of it comes from reprioritised budgets for lending (line 6). This is lending
            that buyers repay, not spending: the Treasury scores the scheme's effect on borrowing as
            a net income of £95m a year from developer fees after running costs (Table 6.1, line
            37). Low–high is an editorial ±10% because the source gives a central figure only.
