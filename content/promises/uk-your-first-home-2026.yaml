format: openpromises/1
id: uk-your-first-home-2026
headline:
  en: Launch the Your First Home equity loan scheme
actor_id: hm-government
made_on: "2026-09-26"
venue: press_release
venue_label:
  en: MHCLG press release
area: housing_env
status: funded
status_note:
  en: >-
    The Autumn Budget 2026 confirmed the scheme with £4.7bn of equity loans for around 70,000
    first-time buyers, up to 20% of the price, with a five-year interest-free period (paragraph
    6.113). The first loans complete from April 2027 (Policy costings, page 38). The Budget sets
    £700m of lending in 2027-28 and £1bn a year from 2028-29 (Table 6.2, line 5). Developers pay a
    fee, and the Treasury expects the fees to leave a net income of £95m a year after running costs
    (Table 6.1, line 37). The Budget does not give the price and income caps.
