status_note:
  en: >-
    In a statement on the humanitarian situation in Gaza, the minister said the government is
    working at pace to bring in a wider trade ban on illegal settlements, which the Foreign
    Secretary has said will take six to nine months; he hoped it would be at the earlier end. He did
    not say from when the six to nine months run, so the card has no deadline. He also said work is
    under way on a new sanctions regime targeting illegal settlement activity, announced in
    September. The card moves when legislation for the ban is laid.
