id: uk-defence-25-2030
headline:
  en: Spend 2.5% of GDP on defence by 2030
actor_id: rishi-sunak
made_on: "2024-04-23"
venue: speech
venue_label:
  en: Defence speech in Warsaw
area: defence
status: funded
status_note:
  en: >-
    The government set out the plan the same day in the policy paper Defending Britain: spending to
    rise each year to 2.5% of GDP in 2030, £87bn in 2030-31. After the change of government on 5
    July 2024 the new government kept the 2.5% level and brought it forward: the Spending Review
    2025 confirms defence spending rising to 2.6% of GDP from 2027 on NATO's measure, which counts
    more intelligence spending (card uk-defence-25-2027), with the defence budget set to 2028-29.
    "By 2030" is read as the end of 2030. The card moves to Delivered when spending figures show
    2.5% of GDP reached.
responsible:
  actor_id: hm-government
  note:
    en: >-
      The government since July 2024 has taken on the 2.5% level and brought it forward to 2027.
