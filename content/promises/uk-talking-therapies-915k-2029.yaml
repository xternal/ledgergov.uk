format: openpromises/1
id: uk-talking-therapies-915k-2029
headline:
  en: Expand NHS talking therapies to 915,000 a year
actor_id: hm-government
made_on: "2024-11-26"
venue: press_release
venue_label:
  en: Get Britain Working white paper (GOV.UK)
area: health
status: in_plan
status_note:
  en: >-
    In 2025-26, 674,683 referrals completed a course of NHS Talking Therapies, up 0.6% on the year
    before, with 50.1% reliably recovering (NHS England Digital, 24 September 2026); reaching 915,000
    in 2028-29 needs about 36% more, and NHS England's interim target is 805,000 in 2026-27 with 51%
    recovery. The expansion was funded by the previous government's Autumn Statement 2023 (£220m in 2028-29) and
    kept by this government as an existing commitment; NHS England's plan sets the 915,000 target with a 53%
    recovery rate. The Department of Health and Social Care restated it on 9 October 2026. Figures count
    referrals, and one person can have more than one.
