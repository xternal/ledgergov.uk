status_note:
  en: >-
    The scheme targets energy debt built up during the bill increases after Russia's invasion of
    Ukraine. The joint strategy of the energy department and Ofgem says Ofgem will consult further
    on its design in late 2026 and intends, subject to that consultation, to launch it in 2027, read
