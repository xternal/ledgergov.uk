versions:
  - version: 1
    text: >-
      Outlining the UK’s unflinching support, the Prime Minister said he was delighted to be able to
      update the President this morning, on behalf of the Ukrainian people, how the UK would
      increase its financial support to Ukraine by £10 billion in today’s Budget.

      That included £500 million additional military support from the Ministry of Defence to plug
      urgent gaps in Ukraine’s air defences this winter, £7 billion of economic support being made
      available over three years, and a further £3 billion in UK Export Finance (UKEF) capacity for
      Ukraine, prioritised for military support, the Prime Minister said.
