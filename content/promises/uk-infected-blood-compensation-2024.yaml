headline:
  en: Pay comprehensive infected blood compensation
actor_id: rishi-sunak
made_on: "2024-05-20"
venue: parliament
venue_label:
  en: Commons statement on the Infected Blood Inquiry report
area: health
status: delivering
status_note:
  en: >-
    Compensation is being paid and not yet complete. The Victims and Prisoners Act 2024, law since
    24 May 2024, provides for the Infected Blood Compensation Authority and the compensation scheme
    (Part 3). The authority made its first payment to a living infected person in December 2024; by 31
    March 2026 it had paid £2.05 billion to 3,153 people, while 17,970 had registered their intent to
    claim (its annual report for 2025 to 2026).
responsible:
  actor_id: hm-government
  note:
    en: >-
      The government since July 2024 took the scheme on: its compensation authority has made the
      payments.
