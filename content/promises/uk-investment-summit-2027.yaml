status_note:
  en: >-
    The Chancellor named Gateshead in the Budget statement; the Budget document says the summit
    "will take place in spring 2027 in Newcastle" (para 4.123). Both are on Tyneside; the card
    follows the quote and records the difference. "In the spring" is read as by the end of May
    2027. The card moves to Delivered when the summit is held.
