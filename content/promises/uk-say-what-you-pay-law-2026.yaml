status_note:
  en: >-
    The Prime Minister says employers will be legally required to publish salaries in job adverts.
    The government says 41% of employers always publish salary ranges and 18% always publish
    specific salaries, and that early analysis shows 94% of consultation respondents back the
    change. It will bring forward legislation as soon as possible, with details to follow. The card
    moves when the legislation is introduced.
