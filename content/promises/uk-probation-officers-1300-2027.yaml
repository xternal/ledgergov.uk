versions:
  - version: 1
    text: >-
      The Government is increasing investment into probation and community services by up to £700
      million by 2028/29. To further manage the increased pressure, we will recruit at least 1,300
      trainee probation officers by March 2027, on top of the 1,389 onboarded in 2025/26, alongside
      introducing new digital technology.
