status_note:
  en: >-
    The government's response to Lord Leveson's Independent Review of the Criminal Courts accepts
    his recommendation on probation funding, and says the 1,300 come on top of the 1,389 taken on in
    2025/26. A Ministry of Justice release on 15 October 2026 repeats the 1,300 and the £700
    million, and says the recruitment happens over the next year. March 2027 is read as 31 March
    2027. The card moves when the Ministry of Justice reports how many trainee probation officers it
    has recruited.
