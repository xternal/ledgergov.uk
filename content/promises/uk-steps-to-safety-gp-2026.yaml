    text: >-
      This will start with an investment of up to £34.4 million over three years to support 12
      Integrated Care Boards across England to deliver the first phase of a primary care referral
      pathway, called Steps to Safety, making sure women and girls experiencing violence and abuse
      can access specialist support through their GP.
