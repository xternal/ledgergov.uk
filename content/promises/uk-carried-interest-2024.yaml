          name: HM Treasury
        note:
          en: >-
            Negative because the pledge raises money. Year used: 2028-29, the year Labour's costings
            use. The official Autumn Budget 2024 costing, covering both the 32% interim rate and the
            move into income tax, is £80m in 2028-29 (Table 5.1, line 21); central figure only.
            Other years: nothing in 2024-25 and 2025-26, a cost of £5m in 2026-27, £140m in 2027-28
            and £85m in 2029-30. Labour's own costing was £565m in 2028-29 (manifesto page 127).
            Low–high is an editorial ±10% because the source gives a central figure only.
        sources:
