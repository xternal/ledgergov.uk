status_note:
  en: >-
    Under the Employment Rights Act 2025, employers may reject a flexible working request only where
    it is reasonable to do so. The government will introduce secondary legislation setting out a
    process employers must follow before rejecting a statutory request, and bring the Act's
    reasonableness test into force; its consultation response was published on 15 September. "Autumn
    2027" is read as 30 November 2027. The card moves when the regulations are made.
