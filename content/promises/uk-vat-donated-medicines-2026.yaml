format: openpromises/1
id: uk-vat-donated-medicines-2026
headline:
  en: Remove VAT barrier to donated medicines
actor_id: andy-burnham
made_on: "2026-10-21"
venue: parliament
venue_label:
  en: >-
    Prime Minister's Questions
area: taxes
status: funded
status_note:
  en: >-
    The Autumn Budget 2026 introduces a zero rate of VAT for medicines donated in qualifying
    circumstances, including through early and expanded access schemes, for donations made on or
    after 23 June 2026 (paragraph 6.187), and costs it at £20m in 2027-28 (Table 6.1, line 88). The
    Budget does not say which Finance Bill or order will make the change.
