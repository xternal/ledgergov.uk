versions:
  - version: 1
    text: >-
      We have been working on a solution that will remove VAT as a barrier to free-of-charge
      donations of innovative medicines. It will be permanent, backdated to 23 June, so that it
      supports companies to continue to make donations. We will set out the details shortly
    recorded_on: "2026-10-21"
