format: openpromises/1
id: uk-hiv-new-cases-2030
headline:
  en: End new HIV cases in England by 2030
actor_id: keir-starmer
made_on: "2024-11-29"
venue: press_release
venue_label:
  en: "Press release (Prime Minister's Office)"
area: health
status: in_plan
status_note:
  en: >-
    The government published the HIV Action Plan for England, 2025 to 2030, on 1 December 2025,
    backed by £170 million, to end new HIV transmissions in England by 2030; on the same day the
    Prime Minister said he had promised it. The UK Health Security Agency (UKHSA) gives the aim as
    no more than 532 new diagnoses in 2030, a 90% fall from 2010. Its provisional figures from
    clinics that reported throughout show new diagnoses falling from 2,922 in 2024 to 2,542 in 2025.
    The deadline is taken as the end of 2030; the card moves to Delivering when an official source
    shows the plan's new programmes running.
responsible:
  actor_id: hm-government
  note:
    en: >-
      The HIV Action Plan for England, 2025 to 2030, is the government's plan, and UKHSA reports
      progress against it.
