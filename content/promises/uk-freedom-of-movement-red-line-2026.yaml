    text: >-
      The red lines in our manifesto, including those on freedom of movement, will stay firmly in
      place for the whole of this Parliament, but what I will not do is defend the deal negotiated
      by the right hon. Lady and the Government she was in, which, in my view, gave us a harder
      Brexit than was promised at the referendum, and has been bad for growth and bad for control of
      immigration.
