versions:
  - version: 1
    text: >-
      We have therefore agreed to overhaul the way regional government is funded, starting by
      replacing grants from central government with a share of local income tax for every mayor
      beginning in 2028, such that where a region grows its tax base, it benefits from the increased
      receipts.
    recorded_on: "2026-07-31"
    source_url: https://www.gov.uk/government/publications/rewiring-the-state-cabinet-statement/rewiring-the-state-cabinet-statement-html
