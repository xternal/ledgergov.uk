format: openpromises/1
id: uk-mayors-income-tax-2026
headline:
  en: Give every mayor a share of income tax
actor_id: hm-government
made_on: "2026-07-31"
venue: press_release
venue_label:
  en: "Cabinet statement: Rewiring the State"
area: general_services
status: in_plan
status_note:
  en: >-
    The Fiscal Devolution Roadmap, published with the Autumn Budget 2026, gives every mayoral
    strategic authority in England a share of the income tax raised in its area from April 2028
    (Table 2.A and paragraph 2.15), taken from the basic rate on earnings and pensions (paragraph
    2.23). Mayors will not set rates or thresholds. The starting amounts, which replace grants, are
    to be set at the next Spending Review, and only areas with a directly elected mayor get the
    share (paragraph 2.53).
