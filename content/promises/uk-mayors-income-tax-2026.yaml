format: openpromises/1
id: uk-mayors-income-tax-2026
headline:
  en: Give every mayor a share of income tax
actor_id: hm-government
made_on: "2026-07-31"
venue: press_release
venue_label:
  en: "Cabinet statement: Rewiring the State"
area: general_services
status: in_plan
status_note:
  en: >-
    The Fiscal Devolution Roadmap, published with Budget 2026, says every mayoral strategic
    authority will be assigned a share of the income tax generated in its area beginning in 2028
    (para 2.15), set out in its timetable as from April 2028. Rates and thresholds stay the same
    across England; mayors get no power to set them (para 2.17). The funding starting points for
    each area will be set at the Spending Review.
