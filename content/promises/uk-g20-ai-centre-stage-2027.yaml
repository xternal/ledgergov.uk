status_note:
  en: >-
    The Prime Minister first said it at the UN General Assembly on 22 September 2026, where he also
    said the UK will work towards agreeing a single set of global principles and standards for AI.
    No 10 said the same day that the UK takes over the G20 Presidency from the US in December 2026
    and that the Leaders' Summit will be held in Manchester the following November, so the deadline
    is recorded as 30 November 2027. Neither speech says what the global code would contain or who
    would sign it. The card moves when the UK's presidency publishes its priorities, and again when
    a code is agreed.
