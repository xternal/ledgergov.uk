versions:
  - version: 1
    text: >-
      In “Protecting What Matters”, our social cohesion plan, we set out a range of measures to
      tackle this threat, including banning those who seek to come to this country to spread hatred,
      and committing to publishing an annual “State of Extremism” report, which will identify the
      threats we face and, crucially, equip frontline professionals to counter them.
