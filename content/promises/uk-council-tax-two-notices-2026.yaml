  en: "Improving enforcement of council tax: government response"
area: taxes
status: promised
status_note:
  en: >-
    A household in England that misses a council tax payment can lose the right to pay by
    instalments. The government will also set a timetable: a final notice no sooner than 14 days
    after the last reminder and 41 days after the first missed payment, then 21 days to pay before
    that right is lost. It will change regulations to do this and assess the cost to councils, but
    gives no date. The card moves when the regulations are laid.
