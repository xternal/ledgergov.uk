id: uk-locum-doctor-vat-2027
headline:
  en: "Charge VAT on supplying locum doctors"
actor_id: hm-government
made_on: "2026-11-11"
venue: press_release
venue_label:
  en: >-
    Revenue and Customs Brief 14 (2026): VAT treatment for supplies of a deputy for a medical
    practitioner
area: taxes
status: promised
status_note:
  en: >-
    HMRC's brief says the government announced at Budget 2026 that it would remove the VAT exemption
    for supplying a deputy for a registered medical practitioner, from 1 May 2027. The First-tier
    Tribunal found in Isle of Wight NHS Foundation Trust v HMRC that the exemption also covered
    supplying locum doctors as staff; the change restores HMRC's earlier reading, so such supplies
    of staff would carry VAT while medical care stays exempt. Until then they stay exempt. The card
    moves when the legislation is made.
