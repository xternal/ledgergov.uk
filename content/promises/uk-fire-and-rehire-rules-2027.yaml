status_note:
  en: >-
    The minister's update on the Employment Rights Act says regulations will set which changes to
    pay and shift patterns are restricted variations under the fire and rehire provisions, following
    a government response published on 22 October 2026. They come into force in March 2027, subject
    to debates in Parliament, when the old Code of Practice on fire and rehire is revoked; a new
    Code follows in summer 2027. March 2027 is read as 31 March. The card moves when the regulations
    are made.
