status_note:
  en: >-
    The Home Secretary set out earned settlement: a five-year path for people earning over £50,000
    and for professions such as doctors, nurses and teachers, three years for those earning over
    £125,000, and ten years for everyone else, who must show a sustained contribution. Some groups,
    including Hong Kong British nationals overseas and members of the armed forces, keep today's
    path. The card moves when the immigration rules are changed.
