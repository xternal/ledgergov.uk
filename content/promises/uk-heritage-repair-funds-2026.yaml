status_note:
  en: >-
    Both funds are part of the £1.5 billion Arts Everywhere Fund, are run by Historic England and
    give priority to the areas of England in greatest need. This round gives over £18 million to 51
    places of worship, the first awards from that fund, and nearly £13 million to 20 heritage at
    risk projects; the heritage fund made 37 awards for 2025/26 in August 2025. A second round of
    each for 2026/27 is to be announced later, and the release does not say when this parliament
    ends, so the card has no deadline.
