status_note:
  en: >-
    On 29 July 2025 the Prime Minister said the UK would recognise the state of Palestine by the
    United Nations General Assembly in September unless the Israeli government took the steps he
    listed, and that an assessment would be made in September. On 21 September 2025 he said that the
    United Kingdom formally recognises the State of Palestine. The deadline is taken as 30 September
    2025, the end of the month he named.
