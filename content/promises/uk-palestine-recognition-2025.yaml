    text: >-
      So today – as part of this process towards peace I can confirm the UK will recognise the state
      of Palestine by the United Nations General Assembly in September unless the Israeli government
      takes substantive steps to end the appalling situation in Gaza, agree to a ceasefire and
      commit to a long-term, sustainable peace, reviving the prospect of a Two State Solution.
