status_note:
  en: >-
    The Autumn Budget 2026 says UK Research and Innovation is focusing £1 billion of investment over
    the next four years on priority innovation clusters aligned with the Industrial Strategy
    (paragraphs 4.77 and 6.84). It does not say which four years or split the money by year, and it
    is not a line in the Budget's table of policy decisions, so the card is not yet Funded.
