status_note:
  en: >-
    The Home Secretary said refugees who come on new safe and legal routes will be on a five-year
    path to settlement, while the standard wait for refugees who did not becomes 20 years, with 10
    more years for those who entered illegally, such as by small boat. Refugees who work or study
    can earn settlement 10 years earlier. The card moves when the immigration rules are changed.
