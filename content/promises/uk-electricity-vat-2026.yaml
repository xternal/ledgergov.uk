format: openpromises/1
id: uk-electricity-vat-2026
headline:
  en: Cut taxes on energy bills
actor_id: andy-burnham
made_on: "2026-07-21"
venue: press_release
venue_label:
  en: No 10 press release
area: taxes
status: delivered
status_note:
  en: >-
    A Treasury order made on 7 September 2026 zero-rates domestic electricity in Great Britain from
    1 October 2026, and the government confirmed the cut took effect that day. The zero rate is
    temporary and ends on 31 March 2027; Northern Ireland gets comparable funding instead because EU
    VAT rules apply there.
