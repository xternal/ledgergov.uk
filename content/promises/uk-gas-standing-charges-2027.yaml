format: openpromises/1
id: uk-gas-standing-charges-2027
headline:
  en: Remove standing charges from household gas bills
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: economic_affairs
status: promised
status_note:
  en: >-
    The Budget document says the government has asked Ofgem to abolish gas standing charges on
    domestic energy bills in Great Britain, "aiming for delivery by the end of 2027 or as soon as
    possible after then", with suppliers recovering the costs through gas unit rates instead and
    targeted mitigation for households less able to benefit (paras 3.9 and 6.25). The government
    will set out details of reforms to electricity standing charges next year. "From next year" is
    read as by the end of 2027, the date the Budget document gives. The card moves when Ofgem
    decides the change.
