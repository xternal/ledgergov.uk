format: openpromises/1
id: uk-mod-sme-spend-2028
headline:
  en: Raise defence spending with small firms by 50%
actor_id: hm-government
made_on: "2026-07-21"
venue: press_release
venue_label:
  en: Ministry of Defence SME action plan (GOV.UK)
area: defence
status: in_plan
status_note:
  en: >-
    The Ministry of Defence's SME action plan (21 July 2026) sets the target in yearly steps against
    a baseline of about £5bn a year: direct spend with SMEs of £1.48bn in 2026-27 and £2bn in
    2027-28 (£1.24bn in 2024-25), and spend through the supply chain of £4.5bn and £5.5bn. The plan
    says the commitment was made with the Defence Industrial Strategy (September 2025). "Summer
    2028" is read as by 31 August 2028. The card moves when the Ministry publishes its SME spend for
    2026-27 and 2027-28.
