  - version: 1
    text: >-
      Today, the Conservative Party has announced that we will abolish Inheritance Tax on the family
      home and raise the individual threshold to £500,000.
    recorded_on: "2026-10-07"
    source_url: https://www.conservatives.com/news/conservatives-to-abolish-inheritance-tax-on-the-family-home
    quote_checked_on: "2026-10-08"
    parameters:
      who:
        en: >-
          Estates passing on a main home, which would become exempt, and estates above today's
          threshold, which would rise to £500,000 per person
      cost:
        range: [6, 7.7, 10.9]
        quality: sourced
        by:
          kind: independent
          name: Tax Policy Associates
        note:
          en: >-
            Year shown: 2029-30. Low is the party's own figure, £6bn a year, from an Onward and
            Oxford Economics analysis in which inheritance tax liabilities of £12.6bn in 2029/30
            fall to £6.6bn. Central and high are the two ends of Tax Policy Associates' independent
            estimate, £7.7bn to £10.9bn a year, which counts people holding on to homes and moving
            other wealth into housing. There is no OBR or HMRC costing.
        sources:
          - title: >-
              Onward: Assessing the implications of inheritance tax reforms in the UK (7 Oct 2026)
            url: https://ukonward.com/reports/assessing-the-implications-of-inheritance-tax-reforms-in-the-uk/
          - title: Tax Policy Associates (8 Oct 2026)
            url: https://taxpolicy.org.uk/2026/10/08/conservatives-inheritance-tax-family-home-cost/
      when:
        en: Not stated ("the next Conservative government"); costed for 2029-30
      funded_by:
        en: >-
          Through the party's plans "to grip public spending, especially the out-of-control welfare
          bill"
