status_note:
  en: >-
    Draft regulations for England would make fillers injected outside the face, such as liquid
    Brazilian butt lifts, surgery that only doctors may perform, and limit procedures such as deep
    chemical peels and vampire facials to doctors, dentists and some nurses, midwives and
    pharmacists. Under-18s would be barred from high-risk treatments. A consultation is open until
    13 January 2027, and the release says the Parliamentary process is currently planned for spring
    2027; it gives no date for the rules to take effect. The card moves when the regulations are
    made.
