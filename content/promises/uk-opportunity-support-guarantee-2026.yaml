status_note:
  en: >-
    Alan Milburn’s final report on young people and work recommended the guarantee, backed by
    legislation; the Secretary of State told the Commons the same day that the government supports
    that recommendation. It is to be delivered through new locally led youth services, a separate
    card. The statement gives no date or cost, and the government will set out next steps on welfare
    reform ahead of a white paper next year. The card moves when the guarantee is set in law or
    starts.
