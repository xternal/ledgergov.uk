status_note:
  en: >-
    The UK’s own carbon border levy (CBAM) is a separate card. The explainer says the matching EU
    exemption for UK goods is expected from 1 January 2028, subject to EU law-making, and goods made
    outside the UK and EU still get carbon price relief. The card moves when the UK exemption is in
    law.
