status_note:
  en: >-
    The Carbon Border Adjustment Mechanism (CBAM) puts a carbon price on highly traded,
    carbon-intensive goods imported into the UK; the Finance Act 2026 provides its legal framework
    and two sets of regulations have been laid. The statement publishes illustrative rates for the
    first quarter of 2027 and the default emissions values for 2027 and 2028, commits to
    country-specific default values from 2029, and says the official first-quarter rates will be
    published before the end of the calendar year. The card moves to delivering when the mechanism
    starts on 1 January 2027.
