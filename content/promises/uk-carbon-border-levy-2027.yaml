    text: >-
      The government is introducing a Carbon Border Adjustment Mechanism (CBAM) from 1 January 2027.
      It will ensure that highly traded, carbon-intensive goods imported into the UK face a carbon
      price comparable to the price that would be paid were the goods produced in the UK.
