status_note:
  en: >-
    V Levels are a new Level 3 vocational route alongside A Levels and T Levels, which the plan says
    will replace many existing vocational qualifications over time. The plan also promises two new
    Level 2 certificates, in Digital Systems and Data from September 2027 and in Digital
    Administration from September 2028, subject to final content development. "From September 2027"
    is read as 30 September 2027. The card moves when the qualification is approved for first
    teaching.
