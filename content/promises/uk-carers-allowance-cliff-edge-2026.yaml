status_note:
  en: >-
    One of five "everyday fixes" the Chancellor announced ahead of the Budget. Today a carer who
    earns a penny over the Weekly Earnings Limit, equal to 16 hours at the National Living Wage,
    loses the whole allowance; instead £1 of support would taper away for each extra £1 earned. The
    Work and Pensions Secretary says the government intends to end the cliff edge, without a date.
    The card moves when the change is legislated or a start date is set.
