status_note:
  en: >-
    The screening programme is running and not yet complete. The National Cancer Plan for England
    (20 April 2026) says over 1.5 million people have attended a lung health check and over 9,000
    have been diagnosed with lung cancer, 76% at stage 1 or 2, and commits to complete the roll-out
    by 2030, when every eligible person will have had a first invitation. The announcement aimed for
    full coverage by March 2030.
