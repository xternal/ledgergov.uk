format: openpromises/1
id: uk-business-rates-100pc-local-2029
headline:
  en: Keep 100% of business rates locally
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: general_services
status: promised
status_note:
  en: >-
    The Budget document says the government intends for local and regional government to retain
    100% of business rates income "before the end of the decade in place of grants from central
    government", with the share kept by local authorities rising to at least 70%. It starts with
    mayoral strategic authorities receiving a 20% share of business rates from April 2027, and the
    government will seek views on how best to reach 100% (paras 4.60 and 4.66). "By the end of the
    decade" is read as the end of 2029. The card moves when a plan or legislation for 100%
    retention is published.
