versions:
  - version: 1
    text: >-
      For the first time, I am making the commitment that 100% of business rates will be retained
      locally by the end of the decade, so if local leaders help businesses to start and grow, more
      of the rates they pay will stay in that area.
    recorded_on: "2026-10-28"
    source_url: https://hansard-api.parliament.uk/debates/debate/3C01A9B5-6F3F-4C82-95F2-21BDCBEBF7AC.json
    parameters:
      who:
        en: Councils and mayoral and other strategic authorities in England
      cost:
        note:
          en: >-
            No cost is given for 100% retention. The Budget's table of policy decisions costs only
            the first step, a share of business rates for mayoral strategic authorities from April
            2027 (Table 6.1, line 21: £10m in 2027-28 rising to £140m in 2031-32). The Budget
            document says the retained rates replace grants from central government.
      when:
        en: By the end of the decade
      deadline: "2029-12-31"
      funded_by: null
