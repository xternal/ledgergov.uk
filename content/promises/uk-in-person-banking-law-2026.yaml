status_note:
  en: >-
    The government accepted the central recommendation of the independent Access to Banking Services
    Review, chaired by Richard Lloyd and published on 16 November 2026. The Economic Secretary’s
    written statement the same day says the government will amend the Financial Services and Markets
    Bill to create a statutory framework for reasonable access to essential in-person banking,
    designed with the FCA, industry and consumer groups. No date is given. The card moves when the
    amendment is tabled and when the framework is in law.
