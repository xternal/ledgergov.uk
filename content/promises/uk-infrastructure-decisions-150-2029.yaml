  en: "Press release on the Plan for Change milestones (Prime Minister's Office)"
area: economic_affairs
status: delivering
status_note:
  en: >-
    The government said on 22 September 2025 that 21 major infrastructure planning decisions were
    made in the Parliament's first year, a record, and four more since, 25 in all, with 10 more
    projects awaiting a decision. The Planning and Infrastructure Act 2025, law since 18 December
    2025, is meant to speed these decisions up, and the government named the 150 decisions as its
    aim when it passed. The end of the Parliament is taken as 1 July 2029. The 1.5 million homes in
    the same sentence are on the Labour Party's manifesto card.
