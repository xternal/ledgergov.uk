status_note:
  en: >-
    Remote electronic monitoring uses on-board cameras, sensors and GPS to record where vessels fish
    and what they catch, including accidental catches of marine mammals, seabirds and sharks.
    Defra's guidance, published the same day, says it will apply to large pelagic trawlers of all
    nationalities fishing in English waters and to English-registered ones wherever they operate,
    and that a full technical specification will be available in 2027. The date is subject to
    parliamentary timings; November 2028 is read as 30 November 2028. The card moves when the
    legislation is made.
