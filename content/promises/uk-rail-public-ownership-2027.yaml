status_note:
  en: >-
    Chiltern Railways' services moved into public ownership on 20 September 2026, so 10 of the 14
    train operators running passenger services under contract with the Department for Transport are
    now publicly owned. The Transport Secretary says Great Western Railway's services transfer next,
    on 13 December 2026, followed by Avanti West Coast's on 7 March 2027, and that the programme
    "remains on track" to be completed by the end of 2027. The statement gives no dates for the
    other operators. The card moves as each operator transfers.
