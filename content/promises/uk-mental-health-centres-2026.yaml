      The mental health strategy will do precisely that. It will confirm the plan to open 100 new
      community mental health centres across the country to get mental health support right into
      communities, and the Health Secretary is ensuring that we also bring forward 59 mental health
      emergency departments to give same-day support to people experiencing a crisis.
