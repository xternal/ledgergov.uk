status_note:
  en: >-
    Asked to fund a mental health in-patient hub in Hertfordshire, the Prime Minister said the
    government will not take that proposal forward, but will bring forward four new community mental
    health centres in Hertfordshire, as part of 159 across the country. He said the Health and
    Social Care Secretary will involve the MP in the design of the new hubs. He gave no date, cost
    or list of places. The card moves when the government publishes where and when the centres will
    open.
