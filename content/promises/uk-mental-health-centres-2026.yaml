headline:
  en: New community mental health centres across the country
actor_id: andy-burnham
made_on: "2026-10-14"
venue: parliament
venue_label:
  en: Prime Minister's Questions
area: health
status: promised
status_note:
  en: >-
    On 14 October 2026 the Prime Minister spoke of 159 new community mental health centres, four of
    them in Hertfordshire. On 21 October he said the forthcoming mental health strategy will confirm
    100 new centres and that 59 mental health emergency departments, offering same-day crisis
    support, will also be brought forward, one of each in Sunderland. He gave no date, cost or full
    list of places. The card moves when the strategy is published.
