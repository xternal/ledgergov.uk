status_note:
  en: >-
    The Department for Education's strategy Giving every child the best start in life (7 July 2025)
    sets the measure: by 2028, 75% of children reaching a good level of development by the end of
    reception. In 2024/25, 68.3% did (Early years foundation stage profile results, 27 November
    2025). The deadline is taken as the end of 2028, so the results for children finishing reception
    in summer 2028 settle it. The card moves when the strategy's money is allocated or its new
    services are running.
