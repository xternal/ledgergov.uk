status_note:
  en: >-
    Biodiversity net gain (BNG) requires a development to leave nature in a better state than
    before. The paper says it has applied to development under the Town and Country Planning Act
    since 2024 and will be extended to nationally significant infrastructure projects, such as large
    energy and transport schemes, from November 2026. "From November 2026" is read as by 30 November
    2026. The card moves when the requirement takes effect for those projects.
