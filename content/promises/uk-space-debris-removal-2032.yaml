  en: >-
    The UK Active Debris Removal mission is run by the UK Space Agency with ClearSpace UK as its
    industry delivery partner. The spacecraft is to launch in 2029 from Saxavord Spaceport in
    Scotland and release the two satellites lower into the atmosphere, where they burn up. The
