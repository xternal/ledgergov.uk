status_note:
  en: >-
    Staying Close helps care leavers up to 25 find and keep a safe home and reach health, education
    and work. It runs in 50 areas; the Department for Education's plan on homelessness among care
    leavers says it becomes a national duty on councils from 2029. The plan builds on the Children's
    Wellbeing and Schools Act 2026. 2029 is read as the end of 2029. The card moves when the duty
    takes effect.
