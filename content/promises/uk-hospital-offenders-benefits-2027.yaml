status_note:
  en: >-
    Regulations laid on 20 October 2026 would remove Universal Credit, Employment and Support
    Allowance, State Pension and Pension Credit from people convicted of specified serious offences
    and detained in hospital under a hospital order. They need Parliament's approval. The Work and
    Pensions Secretary's written statement (HCWS391) says he announced the intention in January
    2026. The release gives no exact date for "early next year", so the card has no deadline. The
    card moves when Parliament approves the regulations.
