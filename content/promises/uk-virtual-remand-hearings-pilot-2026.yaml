status_note:
  en: >-
    Under Virtual Remand Hearings, defendants attend their first court hearing by secure video link
    from a police custody suite instead of being taken to court. It is part of the government's
    response, published 12 October 2026, to Lord Leveson's review of the criminal courts. The
    release names neither the police force areas nor a start date.
