status_note:
  en: >-
    The Employment Rights Act 2025 gives the power to create a day-one right to bereavement leave
    for the loss of loved ones, including pregnancy loss before 24 weeks; currently only parents who
    lose a child aged under 18, or stillborn from 24 weeks, have a statutory right. The government's
    consultation response, published on 22 September 2026, sets the final details, to be laid in
    secondary legislation; the statement does not give the length of leave. "In April 2027" is read
    as 30 April 2027. The card moves when the regulations are made.
