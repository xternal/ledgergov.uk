format: openpromises/1
id: uk-adhd-autism-cqc-2026
headline:
  en: Make ADHD and autism assessments CQC-regulated
actor_id: yvette-cooper
made_on: "2026-10-09"
venue: press_release
venue_label:
  en: Press release (DHSC), quote from the Health Secretary
area: health
status: promised
status_note:
  en: >-
    It follows Professor Peter Fonagy's review of mental health and neurodevelopmental services. The
    department's own text in the same release is more cautious: it says the government is "working
    towards" making all diagnostic assessments a regulated activity for the Care Quality Commission,
    covering NHS-funded and private patients. No date, legislation or cost has been published.
