versions:
  - version: 1
    text: >-
      Based on the review findings, we will also take action to strengthen the oversight of mental
      health and neurodevelopmental services, and make all diagnostic assessments for ADHD and
      autism CQC-regulated, so people can be confident that assessments are high quality and that
      the NHS is not being overcharged by independent or private providers.
