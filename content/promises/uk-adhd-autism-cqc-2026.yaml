  - title: >-
      DHSC press release, 9 Oct 2026: Government pledges earlier support to tackle mental health
      crises
    url: https://www.gov.uk/government/news/government-pledges-earlier-support-to-tackle-mental-health-crises
  - title: >-
      Written ministerial statement HCWS364, 12 Oct 2026: Health and care reviews, improvement and
      regulation
    url: https://questions-statements.parliament.uk/written-statements/detail/2026-10-12/HCWS364
versions:
  - version: 1
    text: >-
      Based on the review findings, we will also take action to strengthen the oversight of mental
      health and neurodevelopmental services, and make all diagnostic assessments for ADHD and
      autism CQC-regulated, so people can be confident that assessments are high quality and that
      the NHS is not being overcharged by independent or private providers.
    recorded_on: "2026-10-09"
    source_url: https://www.gov.uk/government/news/government-pledges-earlier-support-to-tackle-mental-health-crises
    quote_checked_on: "2026-10-10"
