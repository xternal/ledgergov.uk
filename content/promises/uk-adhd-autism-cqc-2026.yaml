      who:
        en: >-
          People in England assessed for ADHD or autism, through the NHS or privately; the providers
          who carry out the assessments would be regulated by the Care Quality Commission
      cost:
        note:
          en: No cost has been published.
      when:
        en: Not stated
      funded_by: null
  - version: 2
    text: >-
      We will work to bring all diagnostic assessments under CQC regulation, helping to ensure
      people receive high-quality, clinically robust assessments regardless of how they access care,
      and we are also acting on concerns about the advertising of ADHD and autism assessment
      services.
    recorded_on: "2026-10-12"
    source_url: https://questions-statements.parliament.uk/written-statements/detail/2026-10-12/HCWS364
