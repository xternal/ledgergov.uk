id: uk-neighbourhood-police-3000-2026
headline:
  en: 3,000 more neighbourhood police by March
actor_id: keir-starmer
made_on: "2025-12-01"
venue: speech
venue_label:
  en: Speech on a Britain built for all
area: public_order
status: delivered
status_note:
  en: >-
    Home Office statistics show 3,814 more full-time-equivalent police officers and police community
    support officers (PCSOs) in neighbourhood roles in England and Wales at 31 March 2026 than a
    year earlier; 3,494 of the increase were police officers. The count includes officers in
    training who are destined for neighbourhood roles (350 at that date). The government's target
    for the year was 3,011. It is a first step towards the 13,000 more neighbourhood personnel in
    Labour's 2024 manifesto, which has its own card. "By March" is read as 31 March 2026.
