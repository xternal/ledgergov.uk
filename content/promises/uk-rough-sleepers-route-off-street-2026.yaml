status_note:
  en: >-
    Announced on the day of the first Rough Sleeping Summit at Downing Street. The release says the
    programme, backed by an initial £442 million, is focused on offering everyone who needs it a
    route off the streets before Christmas, with outreach teams and new bedspaces already operating
    in Coventry. In a Commons statement on 26 October the homelessness minister Florence Eshalomi
    called it the government's immediate commitment. "Before Christmas" is read as 25 December 2026.
    The card moves when the government reports how many people sleeping rough have been offered a
    route off the street.
