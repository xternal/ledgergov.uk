versions:
  - version: 1
    text: >-
      The Prime Minister today set out his confidence that everyone sleeping rough will be offered a
      route off the street or wider support before Christmas, as he announces a further £432 million
      to help deliver the ambition and sustain support for years to come.

      The additional funding, to be set out at the Budget later this week, reflects the Prime
      Minister’s determination to make tackling rough sleeping a national priority. It will extend
      support beyond March 2027 and through to the end of this Parliament, taking total investment
      behind his commitment to £874 million.
