status_note:
  en: >-
    The Education Secretary said the government accepts all 27 recommendations of Sir David Bell's
    review of antisemitism in schools and colleges, including treating antisemitism as a
    safeguarding issue. The Department for Education's release lists training for education leaders,
    safeguarding and impartiality guidance, better reporting of incidents and support for complex
    cases. She said there will be new funding but gave no figure, and "within the year" does not say
    whether she means 2026 or the next twelve months, so the card has no deadline. The card moves
    when the resources and training are published.
