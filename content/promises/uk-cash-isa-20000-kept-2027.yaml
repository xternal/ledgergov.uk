status_note:
  en: >-
    At Budget 2025 the government said the cash ISA limit for under-65s would fall from £20,000 to
    £12,000 from 6 April 2027. The paper says Budget 2026 dropped that cut, and the regulations that
    made it are revoked from 6 April 2027. The card moves when the 2027-28 tax year starts with the
    limit unchanged.
