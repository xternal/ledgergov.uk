  en: Press release (Ministry of Housing, Communities and Local Government)
area: economic_affairs
status: promised
status_note:
  en: >-
    Car clocking is winding back a car's odometer to hide its true mileage. The release says
    fraudulently selling a clocked car is already illegal, and that adding it to the list of banned
    practices will make it easier for enforcers to act; the change applies to businesses selling
    cars to consumers. The minister's written statement the same day (HCWS393) calls it plans to ban
    car clocking and gives no date. The card moves when the change to Schedule 20 of the Digital
    Markets, Competition and Consumers Act 2024 is made.
