status_note:
  en: >-
    Until the mid-1980s, some stillborn babies across the United Kingdom were buried or cremated
    without their parents' involvement; the Health Secretary apologised on behalf of the government.
    The statement says all Trusts must have a dedicated point of contact in their PALS service, or
    an equivalent named service, for families seeking answers, and that guidance produced by Sands
    is going to all Trusts. "Within 4 weeks" of the 13 October 2026 statement is read as 10 November
    2026. The card moves when Trusts confirm their contacts.
