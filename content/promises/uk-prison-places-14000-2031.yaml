format: openpromises/1
id: uk-prison-places-14000-2031
headline:
  en: Build 14,000 more prison places by 2031
actor_id: hm-government
made_on: "2024-12-11"
venue: press_release
venue_label:
  en: Ministry of Justice 10-year Prison Capacity Strategy (GOV.UK)
area: public_order
status: delivering
status_note:
  en: >-
    The Ministry of Justice says around 3,300 places have been delivered since July 2024 (9 October
    2026), including HMP Millsike (about 1,500 places, March 2025); its annual statement counted
    about 5,000 places under construction at the end of 2025. The Spending Review 2025 provides £7bn
    between 2024-25 and 2029-30; the annual statement says completing the 14,000 needs money from
    future Spending Reviews. The 14,000 are the places the previous government's programmes did not
    deliver; they are newly built places, not net capacity. "By 2031" is read as by the end of 2031.
