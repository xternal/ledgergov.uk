versions:
  - version: 1
    text: >-
      Open on Monday, Wednesday and Friday, the Hub is part of the Government’s commitment to
      deliver a Youth Hub in every local area of Great Britain over the next three years, building a
      national network of support for the nearly one million young people not in education,
      employment or training.
    recorded_on: "2026-10-12"
    source_url: https://www.gov.uk/government/news/major-boost-for-young-people-in-exeter-as-youth-hub-opens-to-support-them-towards-work
