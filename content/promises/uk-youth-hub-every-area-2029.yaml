status_note:
  en: >-
    Youth Hubs put Jobcentre Plus, council services, employers and training providers under one roof
    for young people aged 16 to 24. The Department for Work and Pensions repeated the commitment on
    12 October 2026 as a hub opened in Exeter, and says every hub will meet a set of minimum
    standards. A DWP release on 15 October 2026 puts the expansion at more than 360 communities
    across Great Britain, with no time frame. Neither release says when the three years started, so
    the card has no deadline yet.
