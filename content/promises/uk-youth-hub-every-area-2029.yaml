          education, employment or training
      cost:
        note:
          en: >-
            The release says the government is investing £2.5bn so that all young people can earn or
            learn, but not how much of that pays for Youth Hubs, so no yearly figure is shown.
      when:
        en: Over the next three years (start not stated)
      funded_by: null
  - version: 2
    text: >-
      The Government is introducing a Jobs Guarantee expected to support more than 90,000 young
      people, alongside 300,000 additional work experience and training placements, the ambition to
      see 50,000 additional young apprentices and an expansion of Youth Hubs to more than 360
      communities across Great Britain.
    recorded_on: "2026-10-15"
