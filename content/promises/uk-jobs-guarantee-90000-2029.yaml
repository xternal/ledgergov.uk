status_note:
  en: >-
    The Jobs Guarantee, run first in six areas, is being rolled out across England, Scotland and
    Wales for 18 to 24 year olds on Universal Credit who are looking for work. The government fully
    funds up to 25 hours of paid work a week for six months at the relevant minimum wage, with
    support before and during the job. No cost is given for the scheme alone. The card moves when
    the government reports how many young people it has helped into work.
