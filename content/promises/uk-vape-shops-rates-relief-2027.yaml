status_note:
  en: >-
    From April 2027, vape shops and adult gaming centres in England lose the lower business rates
    multipliers for retail, hospitality and leisure (RHL) properties, and vape shops also lose Small
    Business Rates Relief. The government's high streets plan says these businesses do not make a
    positive contribution to communities. It gives no figure for the money raised. April 2027 is
    read as 1 April 2027. The card moves when the change takes effect.
