area: housing_env
status: promised
status_note:
  en: >-
    The Renters' Rights Act 2025 abolishes "no fault" evictions under Section 21 and moves tenants
    to rolling tenancies. The government response says it is working towards starting the Act for
    the social rented sector in October 2027, read here as by 31 October 2027, and will update its
    direction to the Regulator of Social Housing to match. The card moves when the commencement
    regulations for social housing are made.
