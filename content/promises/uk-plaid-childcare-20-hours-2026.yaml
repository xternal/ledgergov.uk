status_note:
  en: >-
    A pledge about Wales, where childcare is devolved. The Welsh Government's Programme for
    Government 2026 to 2030 commits to a new childcare offer from 9 months to 4 years, building to
    20 hours a week for 48 weeks a year, so the card is In plan. The existing offer for 3 and
    4-year-olds of working parents stays.
