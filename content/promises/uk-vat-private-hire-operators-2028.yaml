status_note:
  en: >-
    The paper says the change applies only to larger operators above a fare turnover threshold, with
    £50 million a year the lead option for consultation, and takes effect from 2 January 2028. In
    London operators already act as principal. It says fares may change if operators pass the tax
    on. The card moves when the threshold is set and the law is made.
