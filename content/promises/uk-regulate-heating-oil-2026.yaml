status_note:
  en: >-
    The statement is the government's response to the Competition and Markets Authority's market
    study of the heating oil sector, published in July. The CMA found gaps in consumer protection
    compared with gas and electricity users: weaker rights when things go wrong, limited redress,
    less price transparency and less support for vulnerable households. The minister says the
    government will develop options for regulation with Ofgem, the devolved governments, industry
    and consumer representatives, that this "will take time", and gives no date. The card moves when
    proposals for regulation or legislation are published.
