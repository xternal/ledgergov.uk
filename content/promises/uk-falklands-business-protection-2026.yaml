status_note:
  en: >-
    The government is preparing measures under the Protection of Trading Interests legislation,
    which prevents UK persons from complying with specific extraterritorial measures. The release
    says they will target only Argentine extraterritorial measures affecting the Falkland Islands,
    so that UK persons and companies in lawful activity there keep making decisions under UK law. It
    is dated 13 October 2026, so "the end of the year" is read as 31 December 2026. The card moves
    when the secondary legislation is laid or comes into force.
