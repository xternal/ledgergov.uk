versions:
  - version: 1
    text: >-
      To ensure the nation is more resilient to flooding, the government is investing £4.2 billion
      between last April and March 2029 to repair and replace existing defences and construct new
      ones, with hundreds of projects set to be completed.

      The new target for 200,000 properties to benefit from this investment will deliver a total
      economic benefit of £27.9 billion in avoided damage as communities gain better protection and
      growth is delivered in every postcode.
