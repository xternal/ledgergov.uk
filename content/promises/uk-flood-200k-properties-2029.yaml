status_note:
  en: >-
    A new target set at the start of Flood Action Week. The release is dated 12 October 2026, so
    "last April" is read as April 2026. It says the government spent £2.65bn on flood defences in its
    first two years and better protected almost 62,000 properties, beating a target of 52,000. The
    card moves when the Environment Agency reports properties better protected under the new
    programme.
