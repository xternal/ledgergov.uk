status_note:
  en: >-
    The Home Office's final figures show 20,947 additional officers recruited through the Police
    Uplift Programme by 31 March 2023, against a target of 20,000, taking the number of officers in
    England and Wales to 149,566. 42 of the 43 forces met their own allocation; the Metropolitan
    Police did not. The target was a manifesto commitment of the then government, which the Prime
    Minister repeated here; "this Spring" is read as 31 May 2023.
