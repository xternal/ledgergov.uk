status_note:
  en: >-
    The Home Office's response to its consultation, which drew over 13,800 responses, says the
    government will create a statutory framework for police and other public bodies using biometrics
    and facial recognition, with a new independent oversight body. The policing minister's written
    statement says the Police Reform Bill will carry it, backed by a statutory Code of Practice. No
    date is given. The card moves when the Bill is introduced.
