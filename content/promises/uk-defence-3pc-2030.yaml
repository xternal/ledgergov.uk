format: openpromises/1
id: uk-defence-3pc-2030
headline:
  en: Spend 3% of GDP on defence by 2030
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: defence
status: promised
status_note:
  en: >-
    The Budget document repeats it: at the spending review next year the government will set out
    how it will meet its NATO commitment of 3.5% of GDP on defence by 2035, "with a target date for
    3% in 2030" (para 5.29). It gives no money or yearly path for 3%. "In 2030" is read as by the
    end of 2030. The 3.5% by 2035 is part of the card for 5% of GDP on national security by 2035
    (uk-nato-5pc-2035-2025). The card moves when the spending review sets out the path.
