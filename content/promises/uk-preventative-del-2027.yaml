format: openpromises/1
id: uk-preventative-del-2027
headline:
  en: Ringfence prevention spending at the spending review
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: general_services
status: promised
status_note:
  en: >-
    The Budget document says the government will introduce a new category of ringfenced spending,
    preventative DEL (PDEL), "at the spending review in 2027" (para 2.21). It gives no date within
    2027, so the deadline is the end of 2027. The card moves to Delivered when the spending review
    sets preventative budgets.
