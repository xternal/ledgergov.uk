status_note:
  en: >-
    A £40 million ring-fenced programme, set out by the Prime Minister and the Health and Social
    Care Secretary, for GP practices to give extra care, such as medication reviews, health checks
    and nurse-led respiratory clinics, to up to 300,000 people most at risk of becoming seriously
    unwell. The Minister for Public Health told Parliament the next day that it is the GP Winter
    Proactive Care Programme. "This winter" is read as by 28 February 2027. The card moves when the
    government or NHS England reports how many patients were supported.
