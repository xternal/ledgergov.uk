format: openpromises/1
id: uk-first-time-buyer-isa-2029
headline:
  en: Replace the Lifetime ISA for first-time buyers
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: housing_env
status: in_plan
status_note:
  en: >-
    The Budget document sets it out: a new First Time Buyer ISA from April 2029, keeping the
    Lifetime ISA's £4,000 a year limit and 25% bonus, with the bonus paid on withdrawal for a first
    home up to £450,000 and no upper age limit (para 5.8). Table 6.1, line 38 has it replacing the
    Lifetime ISA for new savers from 6 April 2029. The card moves when the law for the new ISA is
    made.
