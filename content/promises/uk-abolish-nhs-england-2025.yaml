headline:
  en: Abolish NHS England
actor_id: keir-starmer
made_on: "2025-03-13"
venue: speech
venue_label:
  en: Speech on reforming the British state
area: health
status: in_plan
status_note:
  en: >-
    The Health Bill, introduced in the Commons on 14 May 2026, abolishes NHS England as a statutory
    body. It passed the Commons on 8 September 2026, under the current government, had its second
    reading in the House of Lords on 13 October 2026, and is due in committee there from 28 October
    2026. NHS England still exists: it laid its 2025-26 annual report before Parliament on 3
    September 2026. The Prime Minister gave no date; the Health Secretary told the Commons the same
    day that it would take two years. The card moves to Legislated when the Bill becomes law.
