id: uk-medical-training-places-2031
headline:
  en: Double medical training places by 2031
actor_id: rishi-sunak
made_on: "2023-06-30"
venue: speech
venue_label:
  en: Speech launching the NHS Long Term Workforce Plan
area: health
status: funded
status_note:
  en: >-
    The NHS Long Term Workforce Plan, published the same day, set the target: medical school places
    in England doubled to 15,000 a year by 2031, from the 7,500 reached in 2020. His government then
    funded the first extra places: 205 for students starting in 2024 and 350 for 2025 to 2026. The
    government since July 2024 has not restated the target. Its 10 Year Health Plan (3 July 2025)
    says the NHS will have fewer staff by 2035 than the 2023 plan projected, aims any expansion of
    medical school places at schools that widen access, and promises a new 10 Year Workforce Plan;
    its call for evidence closed on 7 November 2025, and no such plan was on GOV.UK by 21 October
    2026.
