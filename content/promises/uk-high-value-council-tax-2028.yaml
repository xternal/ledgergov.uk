status_note:
  en: >-
    First announced at Budget 2025. The paper sets four bands, from £2,500 a year for homes worth £2
    million to £2.5 million up to £7,500 for £5 million and over, collected by councils for central
    government, and expects about 150,000 owners to pay. It is in section 3 of the Finance Bill
    2026-27, with secondary legislation in 2027. The card moves when the Finance Bill becomes law.
