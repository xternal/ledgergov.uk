format: openpromises/1
id: uk-living-standards-2029
headline:
  en: Raise household income and GDP per head
actor_id: keir-starmer
made_on: "2024-12-05"
venue: press_release
venue_label:
  en: "Press release on the Plan for Change milestones (Prime Minister's Office)"
area: economic_affairs
status: promised
status_note:
  en: >-
    The Plan for Change measures the milestone by higher real household disposable income (RHDI) per
    person and GDP per head by the end of the Parliament, and names no starting point. In the second
    quarter of 2026, real GDP per head rose 0.5% and was 1.2% higher than a year earlier; RHDI per
    head rose 1.0%, after falling 0.8% in the first quarter (Office for National Statistics, 30
    September 2026). The highest sustained growth in the G7 is stated as an aim and is not scored.
    The end of the Parliament is taken as 1 July 2029, as on other cards.
