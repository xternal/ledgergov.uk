id: uk-halve-inflation-2023
headline:
  en: Halve inflation in 2023
actor_id: rishi-sunak
made_on: "2023-01-04"
venue: speech
venue_label:
  en: Speech setting out his five priorities
area: economic_affairs
status: delivered
status_note:
  en: >-
    The Office for National Statistics measured consumer price inflation (CPI) at 10.5% in the 12
    months to December 2022 and 4.0% in the 12 months to December 2023, less than half the earlier
    rate. The speech did not say which month or measure the pledge would be judged on; CPI had
    peaked at 11.1% in October 2022. "This year" is read as the end of 2023. It was the first of
    five promises in the speech.
responsible:
  actor_id: hm-government
  note:
    en: >-
      The UK Government was responsible when the pledge fell due at the end of 2023, with Rishi
      Sunak as Prime Minister.
