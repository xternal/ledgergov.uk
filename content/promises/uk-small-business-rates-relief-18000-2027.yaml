versions:
  - version: 1
    text: >-
      I am increasing the threshold for small business rate relief for retail, hospitality and
      leisure businesses from £12,000 to £18,000. That means for 70,000 more businesses, I am not
      just cutting their rates; I am taking them out of paying business rates altogether.
    recorded_on: "2026-10-28"
    source_url: https://hansard-api.parliament.uk/debates/debate/3C01A9B5-6F3F-4C82-95F2-21BDCBEBF7AC.json
