format: openpromises/1
id: uk-small-business-rates-relief-18000-2027
headline:
  en: Raise small business rates relief threshold to £18,000
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: taxes
status: funded
status_note:
  en: >-
    Budget 2026 raises the Small Business Rates Relief thresholds for retail, hospitality and
    leisure properties in England from 1 April 2027: 100% relief up to a rateable value of £18,000
    (from £12,000) and tapered relief up to £21,000 (from £15,000), kept under review alongside the
    2029 revaluation (para 6.190; Table 6.1, line 13). The card moves to Delivering when the higher
    thresholds apply to bills.
