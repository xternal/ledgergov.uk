status_note:
  en: >-
    The government's Hillsborough law, the Public Office (Accountability) Bill, was introduced in
    the Commons on 16 September 2025. Its long title puts a duty of candour on public authorities
    and public officials and creates offences for those who mislead the public. It passed the
    Commons on 14 July 2026, was carried over into the new session, and was in committee in the
    House of Lords in October 2026. The promise gives no date. The card moves to Legislated when the
    Bill becomes law.
