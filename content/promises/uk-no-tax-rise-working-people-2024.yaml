format: openpromises/1
id: uk-no-tax-rise-working-people-2024
headline:
  en: No tax rises for working people
actor_id: labour
made_on: "2024-06-13"
venue: manifesto
venue_label:
  en: 2024 manifesto, page 21
area: taxes
status: in_plan
status_note:
  en: >-
    Autumn Budget 2024 restated the commitment (para 2.35), Budget 2025 said the headline rates were
    not increasing (para 2.27), and Autumn Budget 2026 said the same (para 2.29). The main rates of
    income tax (20%, 40%, 45%), employee National Insurance (8% and 2%) and VAT (20%) have not risen
    since the election and stay the same in 2027-28 (Overview of tax legislation and rates, Annex
    A, 28 October 2026). Other changes affect the same taxes: employer National Insurance rose to
    15% from April 2025, income tax and National Insurance thresholds stay frozen to April 2031, the
    dividend ordinary and upper rates rose by 2 points from April 2026, and from April 2027 tax
    rates on savings and property income rise by 4 points in all, to 24%, 44% and 49%: 2 points set
    by Budget 2025 (Finance Act 2026 ss.4, 5 and 7) and 2 more by Autumn Budget 2026 (paras 6.246
    and 6.247). The pledge names National Insurance, the main rates of income tax and VAT; it does
    not cover capital gains tax, whose main rates Autumn Budget 2024 raised from 10% and 20% to 18%
    and 24% from 30 October 2024 (para 2.48). Autumn Budget 2026 leaves those rates unchanged, cuts
    the lifetime limit for Business Asset Disposal Relief from £1 million to £500,000 and adds a
    Founders' Relief taxing up to £10 million of qualifying gains at 10%, both from 6 April 2027
    (paras 6.257 and 6.261). The card stays at In plan until the pledge can be judged as a whole at
    the end of the Parliament, taken as 1 July 2029.
