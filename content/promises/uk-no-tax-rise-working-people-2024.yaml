versions:
  - version: 1
    text: >-
      Labour will not increase taxes on working people, which is why we will not increase National
      Insurance, the basic, higher, or additional rates of Income Tax, or VAT.
    recorded_on: "2024-06-13"
    source_url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=21
    quote_checked_on: "2026-10-06"
    parameters:
      who:
        en: People in work across the UK who pay income tax, National Insurance and VAT
      cost:
        note:
          en: >-
            Keeping this pledge costs nothing against current plans, because it only rules out
            rises; Labour's fiscal plan lists no cost for it. For scale, HMRC estimates that in
            2027-28 1p on the basic rate of income tax would raise about £8.25bn, 1 percentage point
            on the main rate of employee National Insurance about £5.3bn, and 1 percentage point on
            the standard rate of VAT about £9.2bn. These are HMRC's June 2025 estimates, made before
            Budget 2025; HMRC has postponed its next update.
        sources:
          - title: "Labour Party: Change, 2024 manifesto (PDF), fiscal plan, page 126"
            url: https://labour.org.uk/wp-content/uploads/2024/06/Labour-Party-manifesto-2024.pdf#page=126
          - title: "HMRC: Direct effects of illustrative tax changes, bulletin (June 2025)"
            url: https://www.gov.uk/government/statistics/direct-effects-of-illustrative-tax-changes/direct-effects-of-illustrative-tax-changes-bulletin-january-2025
          - title: "HMRC: Direct effects of illustrative tax changes, tables (June 2025, ODS)"
            url: https://assets.publishing.service.gov.uk/media/68552862b46781eacfd71d71/June_2025_TRR_ODS__1_.ods
          - title: "HMRC: 2026 statistics announcements (6 Jul 2026: next edition postponed)"
            url: https://www.gov.uk/government/statistics/schedule-of-updates-and-announcements-for-hmrcs-statistics/2026-hmrc-statistics-announcements
      when:
        en: For the Parliament (taken as to 1 July 2029)
      deadline: "2029-07-01"
      funded_by: null
events:
  - date: "2024-06-13"
    type: promised
    text:
      en: >-
        Labour manifesto pledges not to raise National Insurance, the main rates of income tax or VAT
  - date: "2024-10-30"
    type: in_plan
    text:
      en: >-
        Autumn Budget 2024 says the government is not increasing the basic, higher or additional
        rates of income tax, National Insurance contributions or VAT; the same Budget raises the
        employer National Insurance rate to 15% from April 2025
    evidence_url: https://assets.publishing.service.gov.uk/media/672b9695fbd69e1861921c63/Autumn_Budget_2024_Accessible.pdf
  - date: "2025-11-26"
    type: in_plan
    text:
      en: >-
        Budget 2025 says the government is not increasing the headline rates of income tax, National
        Insurance contributions or VAT; it extends the threshold freeze to April 2031 and raises tax
        rates on dividend, savings and property income
    evidence_url: https://assets.publishing.service.gov.uk/media/6929b353345e31ab14ecf735/E03444720_Budget_2025_Web_Accessible.pdf
  - date: "2029-07-01"
    type: deadline
    text:
      en: End of the Parliament (editorial date)
  - date: "2026-10-28"
    type: in_plan
    text:
      en: >-
        Autumn Budget 2026 says there is no increase to the headline rates of income tax, National
        Insurance contributions or VAT; it raises tax rates on savings and property income by a
        further 2 points from April 2027
    evidence_url: https://assets.publishing.service.gov.uk/media/6ae20b85460c1346f7be784e/E03668986_HMT_Budget_2026_ELAY__2_.pdf#page=41
