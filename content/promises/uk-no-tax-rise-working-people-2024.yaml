  - date: "2026-10-08"
    path: versions[0].parameters.cost.note
    was:
      en: >-
        A pledge not to raise rates has no direct cost against existing plans, and no official
        costing of it exists. Labour's fiscal plan says policies not listed in its costings are
        funded from existing budgets or have no cost.
    now:
      en: >-
        Keeping this pledge costs nothing against current plans, because it only rules out rises;
        Labour's fiscal plan lists no cost for it. For scale, HMRC estimates that in 2027-28 1p on
        the basic rate of income tax would raise about £8.25bn, 1 percentage point on the main rate
        of employee National Insurance about £5.3bn, and 1 percentage point on the standard rate of
        VAT about £9.2bn. These are HMRC's June 2025 estimates, made before Budget 2025; HMRC has
        postponed its next update.
    reason:
      en: >-
        The note now gives HMRC's official estimates of what each rise the pledge rules out would
        raise, for scale. The pledge itself still has no cost against current plans.
    source_url: https://www.gov.uk/government/statistics/direct-effects-of-illustrative-tax-changes/direct-effects-of-illustrative-tax-changes-bulletin-january-2025
