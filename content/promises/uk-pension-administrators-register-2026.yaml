status_note:
  en: >-
    The Department for Work and Pensions' response to its consultation on trustees and governance
    says administrators of schemes regulated by The Pensions Regulator, public and private sector,
    will have to register with it, and that the government intends to work with industry on
    mandatory minimum standards for administration providers. The regulator would be able to request
    information, investigate, and issue warnings, improvement notices and financial penalties. The
    response gives no date or cost. The card moves when legislation for the registration framework
    is introduced.
