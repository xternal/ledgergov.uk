format: openpromises/1
id: uk-child-nude-images-law-2026
headline:
  en: Stop children taking, sharing or viewing naked pictures
actor_id: hm-government
made_on: "2026-09-09"
venue: press_release
venue_label:
  en: Press release (DCMS)
area: public_order
status: promised
status_note:
  en: >-
    No date was given: the government says it will introduce the legislation as soon as possible,
    and will reassess whether it is needed if companies put solutions in place themselves. The same
    press release says features that keep users scrolling for longer, such as videos that play one
    after another and personalised feeds, will also be switched off by default for 16 and
    17-year-olds; no date is given for this either.
responsible:
  actor_id: hm-government
origin: llm_intake
sources:
  - title: >-
      DCMS press release, 9 Sep 2026: UK to have world's strongest online child safety laws as
      government prepares legislation on nude images
    url: https://www.gov.uk/government/news/uk-to-have-worlds-strongest-online-child-safety-laws-as-government-prepares-legislation-on-nude-images
versions:
  - version: 1
    text: >-
      New legislation will be prepared by the government to force tech companies to make it
      impossible for children to take, share or view naked pictures.
    recorded_on: "2026-09-09"
    source_url: https://www.gov.uk/government/news/uk-to-have-worlds-strongest-online-child-safety-laws-as-government-prepares-legislation-on-nude-images
    quote_checked_on: "2026-10-07"
    parameters:
      who:
        en: >-
          Children under 18 in the UK; technology companies, which would be legally required to
          build protections into their devices
      cost:
        note:
          en: >-
            No cost to the public purse stated. The law would require technology companies to build
            protections into their devices, so the main cost falls on the companies. The government
            has not yet published the bill or an impact assessment, and its announcement gives no
            figure.
        sources:
          - title: >-
