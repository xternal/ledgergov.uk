status_note:
  en: >-
    On 15 January 2026 a Cabinet Office minister told the Commons that nobody would have to have a
    digital ID and that the government would require right to work checks to be done digitally. The
    King's Speech of 13 May 2026 promised a Bill for digital ID, but none was introduced. On 21 July
    2026 the new Prime Minister's government cancelled the £1.8 billion digital ID programme to pay
    for a tax cut on household electricity bills, and a Home Office minister said on 7 September
    2026 that the proposals are no longer being taken forward. The promise was officially abandoned,
    so it reads Not met before its deadline.
