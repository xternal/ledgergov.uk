status_note:
  en: >-
    A restatement in the Department for Energy Security and Net Zero's clean electrification
    roadmap: the Zero Emission Vehicle mandate will phase out new cars running solely on petrol or
    diesel from 2030, and new cars and vans that are not zero emission from 2035. The roadmap says
    more than one in four new cars sold are now electric. 2030 is read as the end of 2030. The card
    moves when the government reports the 2030 step in force.
