status_note:
  en: >-
    The AI Safety Institute was launched on 2 November 2023, at the AI Safety Summit at Bletchley
    Park, a week after the speech. It grew out of the Frontier AI Taskforce, with Ian Hogarth as its
    chair. On 14 February 2025 the next government renamed it the UK AI Security Institute and gave
    it a team on the criminal misuse of AI.
