status_note:
  en: >-
    The Prime Minister announced the change on 29 September 2026; the Environment Secretary repeated
    it to Parliament on 12 October. She says it lets the government act where water companies let
    customers and the environment down, and that the government still relies on private investment.
    A ten-year plan due later this year is to set out stronger public control of the water sector.
    The card moves to legislated when the Water Bill becomes law with the change.
