format: openpromises/1
id: uk-awaabs-law-hazards-2026
headline:
  en: Widen Awaab's Law to more home hazards
actor_id: hm-government
made_on: "2026-10-08"
venue: press_release
venue_label:
  en: Press release (MHCLG), notes to editors
area: housing_env
status: in_plan
status_note:
  en: >-
    Awaab's Law sets legal deadlines for social landlords in England to investigate and fix
    dangerous hazards; since October 2025 it has covered damp and mould. Draft regulations published
    on 13 July 2026 would add excess cold, excess heat, domestic hygiene, falls, electrical,
    explosion and structural collapse hazards from 30 November 2026; they need Parliament's
    approval.
