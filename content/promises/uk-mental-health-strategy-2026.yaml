    url: https://hansard.parliament.uk/Commons/2026-09-09/debates/C226C460-61AA-49F3-BBE8-1219B334BEDC/Engagements
  - title: >-
      DHSC call for evidence, 15 May 2026: Informing the mental health strategy for England
    url: https://www.gov.uk/government/calls-for-evidence/informing-the-mental-health-strategy-for-england
versions:
  - version: 1
    text: >-
      This will all be considered as part of a mental health strategy that will come before this
      House before Christmas.
    recorded_on: "2026-09-09"
    source_url: https://hansard.parliament.uk/Commons/2026-09-09/debates/C226C460-61AA-49F3-BBE8-1219B334BEDC/Engagements
    quote_checked_on: "2026-10-07"
    parameters:
      who:
        en: >-
          Children and adults in England who need mental health support (DHSC's May 2026 call for
          evidence is for a mental health strategy for England). The question was about mental
          health in-patient beds in Hertfordshire and patients sent far from home.
      cost:
        note:
          en: >-
            No separate cost: presenting a strategy costs nothing of its own, and no costing had
            been published by 8 October 2026. For context only: the Department of Health and Social
            Care says NHS mental health spending in England is forecast to reach a record £16.1
            billion in 2026-27. That is the whole NHS mental health budget, not money for this
            promise.
        sources:
          - title: >-
              DHSC: Informing the mental health strategy for England, call for evidence (15 May 2026)
            url: https://www.gov.uk/government/calls-for-evidence/informing-the-mental-health-strategy-for-england/informing-the-mental-health-strategy-for-england-call-for-evidence-document
      when:
        en: Before Christmas 2026
      deadline: "2026-12-24"
      funded_by: null
