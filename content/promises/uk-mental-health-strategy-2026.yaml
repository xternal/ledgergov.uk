format: openpromises/1
id: uk-mental-health-strategy-2026
headline:
  en: Present a mental health strategy before Christmas
actor_id: andy-burnham
made_on: "2026-09-09"
venue: parliament
venue_label:
  en: Prime Minister's Questions
area: health
status: promised
status_note:
  en: >-
    "Before Christmas" is recorded as a deadline of 24 December 2026. DHSC opened a call for
    evidence for a cross-government mental health strategy for England on 15 May 2026; no strategy
    had been published by 7 October 2026.
responsible:
  actor_id: hm-government
origin: llm_intake
