status_note:
  en: >-
    Agreed at the UK-EU summit on 20 November 2026. The No 10 release says the link will exempt £6.5
    billion of British exports, including steel and aluminium, from the EU’s carbon border levy; the
    explainer says that exemption is expected from 1 January 2028, subject to EU law-making. From
    the link, UK and EU allowances can be used in both schemes. The card moves when the link is in
    operation.
