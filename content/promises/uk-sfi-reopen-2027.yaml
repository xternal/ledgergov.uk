status_note:
  en: >-
    The Sustainable Farming Incentive (SFI) pays farmers for environmentally sustainable farming. Its
    second 2026 window, for farmers with at least three hectares, closed the day it opened because
    its budget had been allocated; across both 2026 windows £310m went to new agreements. The
    Environment Secretary says the government will learn from this year's windows, including
    alternatives to first come, first served. The card moves when the 2027 window opens.
