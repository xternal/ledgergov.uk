    text: >-
      In May, the department announced that it would establish an independent process through which
      eligible postmasters who accepted the £75,000 Horizon Shortfall Scheme Fixed Sum Offer could
      seek permission to have their claim fully assessed through the Horizon Shortfall Scheme
      Appeals process. I can now confirm that we expect to launch that process in November.
