status_note:
  en: >-
    The paper says Flood Performance Certificates (FPCs) will give a standard assessment of a
    property's flood risk and resilience, so that steps a household takes to protect its home are
    reflected in its insurance premium. Flood Re, the flood reinsurance scheme, is to run the pilot
    with insurers and lenders. The card moves when the pilot starts.
