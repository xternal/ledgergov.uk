versions:
  - version: 1
    text: >-
      The Chancellor is also announcing today the establishment of a new Energy Wealth Fund, which
      will use tax revenues from North Sea oil and gas to invest in renewable and low carbon energy
      projects and support the green transition. Reflecting our commitment to the North Sea, this
      will start with an initial £2 billion injection of funding, with future revenues from the
      North Sea flowing into the fund over time.
