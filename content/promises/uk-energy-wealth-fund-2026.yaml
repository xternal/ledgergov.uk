venue: press_release
venue_label:
  en: Press release (Department for Energy Security and Net Zero and HM Treasury)
area: economic_affairs
status: funded
status_note:
  en: >-
    The Autumn Budget 2026 provides £2 billion for the Energy Wealth Fund to the National Wealth
    Fund, within £15.4 billion of extra capital for the National Wealth Fund (paragraphs 4.34 and
    4.44; Table 6.2, line 2). The fund will invest in renewable and low carbon energy
    infrastructure and be linked to future North Sea revenues. The Budget does not split the £2
    billion by year or say how much North Sea revenue will follow.
