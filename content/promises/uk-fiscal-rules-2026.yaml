    parameters:
      who:
        en: Everyone in the UK, through the overall balance of taxes, spending and borrowing
      cost:
        note:
          en: >-
            No cost of its own: the pledge is about the overall balance of the public finances, not
            a tax or spending measure. For scale, at Budget 2025 the OBR judged the stability rule
            met in 2029-30 by £21.7bn and the investment rule by £24.4bn. The OBR's forecast on 28
            October 2026 is the next test.
        sources:
