format: openpromises/1
id: uk-fiscal-rules-2026
headline:
  en: Meet the fiscal rules, with a buffer
actor_id: john-healey
made_on: "2026-07-21"
venue: speech
venue_label:
  en: Speech to Treasury staff
area: general_services
status: delivered
status_note:
  en: >-
    The OBR judges both rules met at Budget 2026 (EFO, paras 1.24 and 1.25): the current budget is
    in surplus in 2029-30 by £15bn, £7bn less than at Budget 2025, and net financial liabilities
    fall as a share of GDP in 2029-30 by a margin of £24bn. The buffer the Chancellor promised
    exists but is smaller than before: the OBR notes the margins are below the average of close to
    £30bn held by Chancellors since 2010, and the Treasury says some headroom was used to absorb
    higher debt interest from the conflict in the Middle East (Budget 2026, para 1.20).
