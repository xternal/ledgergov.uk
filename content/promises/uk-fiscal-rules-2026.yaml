format: openpromises/1
id: uk-fiscal-rules-2026
headline:
  en: Meet the fiscal rules, with a buffer
actor_id: john-healey
made_on: "2026-07-21"
venue: speech
venue_label:
  en: Speech to Treasury staff
area: general_services
status: delivered
status_note:
  en: >-
    At the Budget on 28 October 2026 the OBR judged both fiscal rules met in 2029-30: the current
    budget is in surplus by £15bn (0.4% of GDP), £7bn less than at Budget 2025, and debt (public
    sector net financial liabilities) is falling by a margin of £24bn (Economic and fiscal outlook,
    October 2026, paragraph 7.17 and Table 7.1). The OBR puts the chance of meeting the first rule
    at 56%, and its margin at £10bn if planned fuel duty rises do not happen. The welfare cap in the
    same Charter is on course to be missed by £3bn, though the OBR formally assesses it only at the
    first Budget of a Parliament. The Budget describes the margins as a buffer (page 2).
