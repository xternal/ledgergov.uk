headline:
  en: Unsafe cladding fixed or scheduled by 2029
actor_id: hm-government
made_on: "2026-10-14"
venue: press_release
venue_label:
  en: Press release (Ministry of Housing, Communities and Local Government)
area: housing_env
status: promised
status_note:
  en: >-
    The release says this expectation "remains", so the target is not new; it does not say when it
    was first set. It came as the Remediation of Unsafe Cladding Bill was introduced to Parliament
    on 14 October 2026; the release says the key change is that tougher powers will become available
    before the end of 2029. It also says over 470 more buildings are reported to have completed
    cladding remediation since the Remediation Acceleration Plan was published. The card moves when
    the government reports how many buildings over 11 metres are remediated or have a completion
    date.
