status_note:
  en: >-
    From 1 November 2027 landlords other than social landlords must use standard service charge
    demands and give annual reports and accounts, and all landlords must set out administration fees
    in a standard schedule. The requirement extends to social landlords, councils and housing
    associations, from 1 November 2028. The regulations were laid on 12 November 2026; three of the
    five need Parliament's approval. The deadline is the first date. The card moves when the
    regulations are in force.
