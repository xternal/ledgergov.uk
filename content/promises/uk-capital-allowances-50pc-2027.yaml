status_note:
  en: >-
    Capital allowances let businesses deduct spending on plant and machinery from taxable profits.
    The paper says the higher first-year allowance applies to spending from 1 January 2027, and the
    lower writing-down allowance to periods from 1 April 2027 for Corporation Tax and 6 April 2027
    for Income Tax. It is in the Finance Bill 2026-27. The card moves when the Bill becomes law.
