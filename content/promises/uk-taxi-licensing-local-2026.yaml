status_note:
  en: >-
    Peter Lamb MP asked whether the Prime Minister would act so that taxis are licensed in the areas
    in which they operate, saying licensing authorities no longer know who is driving cabs in their
    area. Andy Burnham answered yes and said he would correct this in this House. No plan, Bill or
    date was given. The card moves when the government sets out how it will end cross-border hire.
