    text: >-
      Yes, I will. This is a matter of public safety—and, actually, of the safety of women and
      girls. I do not believe it is acceptable that we can have people with licence plates from 100
      or 200 miles away operating in an area where the driver cannot be held to account, so the
      simple answer is yes.
