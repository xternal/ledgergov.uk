id: uk-sentencing-exclusions-2026
headline:
  en: Exclude rape and grooming offences from earlier release
actor_id: andy-burnham
made_on: "2026-08-04"
venue: press_release
venue_label:
  en: No 10 and Ministry of Justice press release
area: public_order
status: delivered
status_note:
  en: >-
    The Sentencing Act 2026 (Commencement No. 6 and Revocation) Regulations 2026, made on 1
    September, brought the earlier release points into force on 1 October 2026, but not for
    sentences for the offences in their Schedule. The Schedule lists rape, child sex offences and
    meeting a child following sexual grooming. On 30 August the Prime Minister widened the
    exclusions to manslaughter, death by dangerous driving and indecent assault, and the Schedule
    lists those too. The Ministry of Justice publishes the full list of excluded offences.
