format: openpromises/1
id: uk-bics-electricity-2026
headline:
  en: Cut manufacturers’ electricity bills by up to 25%
actor_id: blair-mcdougall
made_on: "2026-09-09"
venue: parliament
venue_label:
  en: Commons statement
area: economic_affairs
status: funded
status_note:
  en: >-
    The Autumn Budget 2026 funds the scheme from 1 April 2027, with a back payment in 2027-28 for
    the support firms would have had in 2026-27 (Table 6.1, line 70; paragraph 6.31). The
    Treasury's line is a net figure: £1,235m in 2027-28 including the back payment, then £65m to
    £465m a year to 2031-32, after savings from removing Carbon Price Support and changing the
    indexation of energy policy costs, and it also covers the Supercharger scheme (Policy costings,
    page 80). It is not the scheme's own yearly cost, so the card keeps the department's estimate.
    Applications close on 30 November 2026. Draft regulations amending the Renewables Obligation
    and Capacity Market rules were laid on 7 September 2026 and need approval by both Houses.
