status_note:
  en: >-
    On 5 November Defra formally adopted a long-term strategy, first published in June, that aims to
    eradicate bovine TB from England by 2038. It includes vaccines for cattle and badgers, mandatory
    blood tests, more wildlife surveillance and more test choice. The release says new herd
    breakdowns are down by a fifth on the previous 12 months. 2038 is read as the end of 2038. The
    card moves when Defra reports progress against the aim.
