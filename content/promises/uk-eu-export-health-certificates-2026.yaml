status_note:
  en: >-
    Part of the deal agreed at the UK-EU summit on 20 November 2026. The release says checks on
    food, farm and plant goods between Britain and the EU will end, products such as fresh sausages,
    burgers and seed potatoes can be sold in the EU again, and the deal could add up to £5.1 billion
    a year to the economy by 2040. It gives no date for the deal to take effect. The card moves when
    the agreement is in force.
