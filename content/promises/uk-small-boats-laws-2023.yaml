status_note:
  en: >-
    The Illegal Migration Act 2023 became law on 20 July 2023, but its central duty to make
    arrangements to remove people who arrive illegally (section 2) was never brought into force. On
    22 July 2024 the new Home Secretary told the Commons that the central duty "has not even been
    enacted". The Border Security, Asylum and Immigration Act 2025 repealed that duty on 2 December
    2025. The laws passed, but the detention and swift removal they promised never applied, so the
    card reads Not met. The Rwanda flights are a separate card (uk-rwanda-first-flight-2024).
