status_note:
  en: >-
    The cap is in the draft Commonhold and Leasehold Reform Bill, published on 27 January 2026: £250
    a year, falling to a peppercorn after 40 years, for leaseholders in England and Wales. The
    King's Speech of 13 May 2026 named the Bill, including the capping of ground rents, and the
    Leader of the House said on 10 September 2026 that it will be introduced; by 20 October 2026 it
    had not been. The government said the cap could come into force in late 2028, subject to
    parliamentary timings. The card moves to Legislated when the Bill becomes law.
