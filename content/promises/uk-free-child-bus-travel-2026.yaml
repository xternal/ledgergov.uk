  en: >-
    The scheme ran from 1 to 31 August 2026 for children aged 5 to 15 on participating local buses
    in England, as the announcement set out. The Department for Transport said on 25 September 2026
    that over 14.5 million free bus journeys were taken by children that summer. It ran after Keir
    Starmer left office on 20 July 2026.
