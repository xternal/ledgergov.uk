status_note:
  en: >-
    The government says the number of magistrates fell from around 25,000 in 2012 to 12,500 by 2021.
    Alongside regional recruitment and a national taskforce, it is spending around £4 million a year
    on marketing to attract candidates. 2028/29 is read as the financial year ending 31 March 2029.
    The card moves when the government publishes the number of magistrates.
