        note:
          en: >-
            Negative because the pledge raises money. Year not stated by the party. Low and high are
            the party's own range, £12bn to £15bn (manifesto page 8); central is the midpoint.
            Independent estimates depend on the design. The Office of Tax Simplification (2020) put
            a static figure for aligning the rates at about £14bn a year, and said "nothing like
            this amount would be raised in practice". CenTax (September 2026) estimates £19.7bn more
            in 2030, but only for a package that also adds an investment allowance, ends the
            tax-free uplift at death and taxes gains when people leave the UK. HMRC's official
            estimates stop at a 10-point rise, show that rise on the higher rate losing £3,565m in
            2028-29, and cannot be scaled up. No official costing of full alignment exists.
        sources:
