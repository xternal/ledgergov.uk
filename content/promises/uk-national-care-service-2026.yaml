status_note:
  en: >-
    Answering a question on social care, the Prime Minister said co-operative principles will be at
    the heart of the new national care service. The day before, the Work and Pensions Secretary, Pat
    McFadden, told the Commons that savings from adjusting the triple lock will make a significant
    contribution to "a rising, more sustainable state pension alongside free personal care through a
    new national care service", and that Baroness Louise Casey will set out the pace and scale of
    its roll-out in a final report next summer. Neither gave a date or a cost for the service. The
    card moves when that report or a plan for the service is published.
