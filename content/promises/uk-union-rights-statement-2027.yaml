status_note:
  en: >-
    The Employment Rights Act 2025 puts a new duty on employers to give workers a written statement
    about their right to join a trade union. The government's consultation response, published on 25
    September, provides for a standard statement drafted by the government, covering what trade
    unions do, recognised unions, the Certification Officer's list and statutory rights on
    membership. The duty is planned to come into force on 1 January 2027 for new workers, with
    existing workers to receive the statement by 6 April 2027. The card moves when the duty comes
    into force.
