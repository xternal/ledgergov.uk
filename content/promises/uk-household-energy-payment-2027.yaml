versions:
  - version: 1
    text: >-
      This winter, for 20 million households in council tax bands A to D, I am announcing a £100
      energy payment for households. It will be paid directly into people’s bank accounts to deal
      with rising energy bills.
    recorded_on: "2026-10-28"
