format: openpromises/1
id: uk-household-energy-payment-2027
headline:
  en: £100 energy payment for bands A–D households
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: social_protection
status: funded
status_note:
  en: >-
    Budget 2026 funds it: a £100 Household Energy Payment for households in council tax bands A to
    D in England, delivered by local authorities from January 2027, alongside £100 million for
    councils to give targeted support to households hit hardest by energy bills (para 6.24; Table
    6.1, line 1, £2,625m in 2026-27). The Chancellor said the Scottish, Welsh and Northern Ireland
    governments will receive their share of the funding. "This winter" is read as by the end of February 2027. The card
    moves to Delivering when payments start.
