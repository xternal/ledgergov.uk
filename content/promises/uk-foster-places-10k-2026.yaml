status_note:
  en: >-
    The release calls this the government's ambition, so the target is not new; it does not say when
    it was first set. It came with a national campaign to recruit foster carers, launched at 10
    Downing Street on 13 October 2026, and says the number of approved foster carers has fallen by
    12% since 2019. The release gives no date for the end of this Parliament and no count of places
    so far, so the card has no deadline. The card moves when the government reports how many new
    foster places have been created.
