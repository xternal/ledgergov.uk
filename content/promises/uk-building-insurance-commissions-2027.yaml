status_note:
  en: >-
    One of five statutory instruments the minister laid on 12 November 2026 to switch on remaining
    measures from the Leasehold and Freehold Reform Act 2024; three of them need Parliament's
    approval before they come into force. From the same date landlords must also give leaseholders a
    standard Building Insurance Disclosure Document on their cover, its cost and any financial
    incentives or conflicts of interest. The card moves when the regulations are approved and in
    force.
