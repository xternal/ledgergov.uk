id: uk-cladding-legal-duty-2026
headline:
  en: Create a legal duty to fix unsafe cladding
actor_id: hm-government
made_on: "2026-10-14"
venue: press_release
venue_label:
  en: Press release (Ministry of Housing, Communities and Local Government)
area: housing_env
status: promised
status_note:
  en: >-
    The Remediation of Unsafe Cladding Bill was introduced to Parliament on 14 October 2026, so the
    duty is not yet law. The same Bill would let the First-tier Tribunal fine a responsible entity
    up to £500,000 for not complying with a Remediation Order, let third parties such as Homes
    England or local authorities carry out remediation if those responsible continuously fail to
    act, create a register of all medium rise residential buildings in England, set a consistent
    approach for fire risk appraisals of external walls, and require responsible entities to share
    remediation plans with residents. The release does not say when the duty would start. The card
    moves to legislated when the Bill becomes law with it.
