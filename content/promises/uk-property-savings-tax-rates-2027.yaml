  en: "Income Tax — changes to tax rates for property and savings income (HMRC policy paper)"
area: taxes
status: promised
status_note:
  en: >-
    From April 2027 the rates rise to 24%, 44% and 49% for property income (in England, Wales and
    Northern Ireland) and for savings income (across the UK), the paper says, announced at Budget
    2026. It estimates around 5% of taxpayers pay on average £225 more a year from the property
    change and around 12% pay £113 more from the savings change. The card moves when the change
    becomes law.
