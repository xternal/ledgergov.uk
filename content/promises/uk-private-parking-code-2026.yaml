  en: >-
    Private Parking Code of Practice: government response
area: economic_affairs
status: promised
status_note:
  en: >-
    The Code was laid before Parliament on 20 October 2026 for 40 days. The press release and the
    minister's written statement (HCWS393) say it gives drivers 5 minutes to decide whether to park
    and 10 minutes to leave, caps charges at £60 if paid within a fortnight and freezes the maximum
    at £100, and limits charges for honest mistakes such as a forgotten permit to £20. Issue on 30
    November 2026 depends on no objection in Parliament; 21 days after issue gives 21 December 2026.
    The card moves when the Code is issued and comes into force.
