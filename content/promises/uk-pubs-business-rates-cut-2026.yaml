format: openpromises/1
id: uk-pubs-business-rates-cut-2026
headline:
  en: Cut business rates 20% for pubs and venues
actor_id: hm-government
made_on: "2026-07-23"
venue: press_release
venue_label:
  en: Press release from No 10, HM Treasury and the business department
area: taxes
status: funded
status_note:
  en: >-
    Budget 2026 adds 20 percentage points of business rates relief for pubs, social clubs and all
    but the very largest live music venues in England from 1 April 2027, taking their relief to 35%
    (para 3.21; Table 6.1, line 12). The Treasury costs it at £160m in 2027-28 and £115m in 2028-29.
    It is paid for partly by removing reliefs for vape shops and adult gaming centres (line 57). The
    Budget does not say where the line for the largest live music venues falls.
