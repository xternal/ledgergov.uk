id: uk-pubs-business-rates-cut-2026
headline:
  en: Cut business rates 20% for pubs and venues
actor_id: hm-government
made_on: "2026-07-23"
venue: press_release
venue_label:
  en: Press release from No 10, HM Treasury and the business department
area: taxes
