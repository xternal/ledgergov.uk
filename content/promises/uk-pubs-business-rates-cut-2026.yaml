format: openpromises/1
id: uk-pubs-business-rates-cut-2026
headline:
  en: Cut business rates 20% for pubs and venues
actor_id: hm-government
made_on: "2026-07-23"
venue: press_release
venue_label:
  en: Press release from No 10, HM Treasury and the business department
area: taxes
status: funded
status_note:
  en: >-
    The Autumn Budget 2026 raises business rates relief for pubs, social clubs and live music
    venues in England by 20 percentage points, from 15% to 35%, from 1 April 2027 (paragraph 6.189;
    Table 6.1, line 12). Live music venues with a rateable value of £1 million or more are left
    out and keep the 15% relief. The Treasury costs it at £160m in 2027-28 and £115m in 2028-29,
    falling to £5m a year after the 2029 revaluation, when the level is to be reviewed. The same
    Budget removes reliefs for vape shops and adult gaming centres from April 2027 (line 57).
