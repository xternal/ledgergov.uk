format: openpromises/1
id: uk-union-learning-fund-2026
headline:
  en: Restore the Union Learning Fund, £15m a year
actor_id: hm-government
made_on: "2026-09-28"
venue: press_release
venue_label:
  en: HM Treasury news story
area: education
status: funded
status_note:
  en: >-
    The Autumn Budget 2026 re-establishes the fund in England with a budget of £15m a year from
    2027-28 for projects put forward by unions (paragraph 6.127), and scores £20m a year in 2027-28
    and 2028-29 (Table 6.1, line 73). The Budget does not say which savings pay for it; the
    Treasury had said in September that savings found by the Department for Work and Pensions
    would.
