headline:
  en: Restore the Union Learning Fund, £15m a year
actor_id: hm-government
made_on: "2026-09-28"
venue: press_release
venue_label:
  en: HM Treasury news story
area: education
status: funded
status_note:
  en: >-
    Budget 2026 re-establishes the fund in England with a budget of £15m a year from 2027-28 (para
    6.127). The policy decisions table lists it among pre-announced measures at £20m in 2027-28 and
    £20m in 2028-29, with nothing shown after that (Table 6.1, line 73); the Budget does not explain
    the difference from £15m or say what happens after 2028-29. The Budget document does not name
    the DWP savings the Treasury said would pay for it.
