status_note:
  en: >-
    No 10 published the release on the evening of 27 July for the announcement on 28 July. It gives
    "an ambition to begin rolling them out from September 2028", recorded as a deadline of 30
    September 2028, and says mayors, local leaders, schools, colleges and employers will design the
    routes first. On 15 October the government said new Vocational GCSEs would replace Technical
    Awards, as part of the Prime Minister's commitment to put technical education on an equal
    footing with the academic path; that is a separate card. The card moves when the government
    publishes how the pathways will work or schools start offering them.
