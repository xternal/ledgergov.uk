status_note:
  en: >-
    The flight was to take people who had arrived in the UK illegally to Rwanda. Twelve weeks from
    22 April 2024 is 15 July 2024. No such flight had left by then: on 22 July 2024 the new Home
    Secretary told the Commons that the partnership had cost £700 million to send four volunteers,
    including the cost of chartering flights that never took off, and that the government would end
    it. The government had changed on 5 July 2024.
