format: openpromises/1
id: uk-self-employed-parental-pay-2029
headline:
  en: Paid parental leave for self-employed fathers and partners
actor_id: john-healey
made_on: "2026-10-28"
venue: parliament
venue_label:
  en: Budget statement, House of Commons
area: social_protection
status: funded
status_note:
  en: >-
    Budget 2026 funds a new Parental Allowance for eligible self-employed fathers, partners and
    adopters in Great Britain from April 2029, also covering people recently employed or unemployed
    who do not qualify for statutory paternity or adoption pay (para 6.12; Table 6.1, line 6). The
    Budget document says it is set to benefit over 150,000 parents a year (page 55). The card moves
    to Delivering when claims open.
