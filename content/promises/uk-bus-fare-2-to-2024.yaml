headline:
  en: Keep the £2 bus fare through 2024
actor_id: rishi-sunak
made_on: "2023-10-04"
venue: press_release
venue_label:
  en: Article by the Prime Minister on GOV.UK
area: economic_affairs
status: delivered
status_note:
  en: >-
    The Department for Transport says the £2 cap on single bus fares ran from 1 January 2023 until
    the end of 2024, and was replaced by a £3 cap in England outside London from 1 January 2025. The
    cap's last six months ran under the government that took office on 5 July 2024, which kept it in
    place until the date he named.
responsible:
  actor_id: hm-government
  note:
    en: >-
      The UK Government was responsible for the cap until the end of December 2024: under Rishi
      Sunak as Prime Minister until 5 July 2024, and under the next government after that.
