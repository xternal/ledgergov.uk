id: uk-glass-packaging-fees-pubs-2027
headline:
  en: "End packaging fees on glass sold to pubs"
actor_id: hm-government
made_on: "2026-11-11"
venue: press_release
venue_label:
  en: >-
    Press release (Department for Environment, Food & Rural Affairs)
area: housing_env
status: promised
status_note:
  en: >-
    Under the Extended Producer Responsibility scheme producers contribute to the cost of managing
    packaging waste. The government says glass drinks containers sold directly to pubs, restaurants
    and other licensed venues are charged twice, and will no longer be liable for the fees from
    April 2027, read as by 30 April 2027, saving up to 6p a beer bottle and 10p a wine bottle. The
    Minister for Water and Flooding's statement the next day calls it an interim measure covering
    the majority of such containers. The release says the savings go to the businesses that pay the
    fees, such as drinks makers, not to pubs directly. The card moves when the change is made.
