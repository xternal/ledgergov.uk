versions:
  - version: 1
    text: >-
      The National Living Wage (NLW), the minimum wage rate for all workers aged 21 and over, will
      rise by 3.9 per cent to £13.21. The minimum wage for 18-20 year olds will increase to £11.27
      and the rates for 16-17 year olds and apprentices will increase to £8.31, all of which are 3.9
      per cent increases in line with that for the NLW.
