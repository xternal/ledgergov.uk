status_note:
  en: >-
    A joint statement at COP31 by Katie White, UK Minister for Climate Transition, and Canada's
    environment minister says the UK has announced around £6 billion of International Climate
    Finance from the aid budget over the next three years, mostly as grants, alongside £6.7 billion
    of public finance through UK-backed investments that are not aid. It says the UK delivered £12.8
    billion between 2021/22 and 2025/26. It does not say which three years, so the card has no
    deadline. The card moves when the government reports what it has spent.
