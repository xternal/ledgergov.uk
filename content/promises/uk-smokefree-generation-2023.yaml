  en: Press release (Prime Minister's Office)
area: health
status: legislated
status_note:
  en: >-
    The plan was a law making it an offence to sell tobacco to anyone born on or after 1 January
    2009, first announced for England. The government that followed brought in its own Tobacco and
    Vapes Bill, which became law on 29 April 2026 as the Tobacco and Vapes Act 2026. Section 1 makes
    it an offence in England and Wales to sell tobacco to anyone born on or after 1 January 2009,
    and section 175 brings that into force on 1 January 2027, with matching sections for Scotland
    and Northern Ireland. The card moves when the ban is in force.
