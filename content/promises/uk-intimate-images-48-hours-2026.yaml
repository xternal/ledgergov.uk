id: uk-intimate-images-48-hours-2026
headline:
  en: Intimate images taken down within 48 hours
actor_id: keir-starmer
made_on: "2026-02-19"
venue: press_release
venue_label:
  en: Press release (Department for Science, Innovation and Technology)
area: public_order
status: delivering
status_note:
  en: >-
    Section 100 of the Crime and Policing Act 2026, law since 29 April 2026, requires online
    services to take down intimate images shared without consent as soon as reasonably practicable
    and no later than 48 hours after a report. It came into force on 29 June 2026 (S.I. 2026/689),
    and Ofcom oversees compliance. No official figures on how platforms comply had been published by
    20 October 2026; the card moves to Delivered when they show reported images coming down within
    48 hours.
