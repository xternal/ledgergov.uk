  en: Written ministerial statement
area: housing_env
status: promised
status_note:
  en: >-
    The government confirmed on 28 September 2026 that it would amend the Social Housing Bill to
    add the duty. It would require public services to identify people at risk of homelessness and
    consider together what they could do to prevent it, within their existing responsibilities.
    Councils would also get a power to refer homeless households to housing associations and other
    private registered providers of social housing. The card moves to legislated when the Bill
    becomes law with the duty.
