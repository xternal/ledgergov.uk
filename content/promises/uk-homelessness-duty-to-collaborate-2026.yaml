versions:
  - version: 1
    text: >-
      A new Duty to Collaborate will be incorporated into the Bill that will require public services
      to work together to identify people at risk of homelessness and jointly consider what action
      they could take, within their existing responsibilities, to help prevent it. Councils will
      also be given a new power to refer homeless households to private registered providers of
      social housing.
