status_note:
  en: >-
    The Housing Secretary, Angela Rayner, said: "We are changing the law so the perpetrator, not the
    survivor, can be made to leave." The change is an amendment tabled on 20 October 2026 to the
    Social Housing Bill, introduced on 14 May 2026. The release says survivors will no longer have
    to prove abuse again where a protective order is already in place, because the order will be
    enough for a court to consider possession, and that the Bill's reforms protect joint tenancies
    from abusive partners. It gives no date. The card moves when the Social Housing Bill becomes law
    with this measure in it.
