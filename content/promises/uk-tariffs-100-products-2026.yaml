status_note:
  en: >-
    One of five "everyday fixes" the Chancellor announced ahead of the Budget. It is the
    government's second cost-of-living tariff package this year; the notes list garlic, gherkins,
    marmalades, sweets, plant-based drinks, kerosene and fertilisers among the products. With the
    suspensions already in place, the release says households could save up to £21 a year on their
    food shop. It does not say when the cuts take effect. The card moves when the tariff cuts are in
    force.
