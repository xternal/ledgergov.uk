format: openpromises/1
id: uk-nine-reservoirs-2050
headline:
  en: Build nine new reservoirs by 2050
actor_id: hm-government
made_on: "2025-05-29"
venue: press_release
venue_label:
  en: Department for Environment, Food & Rural Affairs press release (GOV.UK)
area: housing_env
status: in_plan
status_note:
  en: >-
    The nine are in the water companies' long-term water resources plans, which the government
    approved in January 2025, and in the Water White Paper (January 2026); Defra says the companies
    have committed to bring them online by 2050, in Lincolnshire, Cambridgeshire, Oxfordshire,
    Somerset, Suffolk, Kent, East Sussex and the West Midlands. Water companies build them and bill
    payers fund them through Ofwat's price review, so there is no cost to the public purse; the
    government's part is approval and planning. As of 12 October 2026 none has applied for planning
    consent; the companies aim for the Fens reservoir in 2036 and Lincolnshire by 2040. Havant Thicket,
    under construction, is not one of the nine. Ministers restated the commitment without a date on
    9 October 2026.
