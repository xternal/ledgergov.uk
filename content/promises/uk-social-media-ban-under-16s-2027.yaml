id: uk-social-media-ban-under-16s-2027
headline:
  en: Ban social media for under-16s
actor_id: keir-starmer
made_on: "2026-06-15"
venue: press_release
venue_label:
  en: Press release (Department for Science, Innovation and Technology)
area: culture
status: in_plan
status_note:
  en: >-
    The ban is to be made by regulations under a power that the Children's Wellbeing and Schools Act
    2026 added to the Online Safety Act 2023. The government said on 15 July 2026 that the first
    regulations would be laid before Parliament by the end of 2026 and come into force in spring
    2027, and the Digital, Culture, Media and Sport Secretary told the Commons on 8 September 2026
    that the government is on track for that timetable. No regulations had been laid by 20 October
    2026. Spring 2027 is read as 31 May 2027.
