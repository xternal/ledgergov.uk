  title: UK Carbon Border Adjustment Mechanism - UK-EU ETS Linking Agreement
  date: "2026-11-23"
  venue_label: Written ministerial statement
quote: >-
  The Government is introducing a Carbon Border Adjustment Mechanism (CBAM) from 1 January 2027. It
  will ensure that highly traded, carbon-intensive goods imported into the UK face a carbon price
  comparable to the price that would apply under the UK Emissions Trading Scheme (ETS) if those
  goods were produced in the UK.
