quote: >-
  Extend parental pay to eligible self-employed fathers, partners and adopters in Great Britain from
  April 2029. Those who are recently employed or unemployed, or with a broken or irregular pattern
  of employment will also benefit providing they have sufficient work and earnings history. This new
  Parental Allowance is expected to benefit over 150,000 parents each year.
