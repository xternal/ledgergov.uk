quote: >-
  As part of the government’s efforts to tackle extremism, the government intends to enhance the
  powers available to the Charity Commission to disqualify individuals from acting as a trustee and
  senior manager of a charity and extend the situations in which an individual is automatically
  disqualified from acting in those roles.
