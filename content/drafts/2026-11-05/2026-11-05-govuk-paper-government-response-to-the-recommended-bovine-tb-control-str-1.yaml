quote: >-
  Delivering another commitment made in 2024, later this November we will introduce a new government
  scheme to collect found-dead badgers for TB testing. Building on similar initiatives in Wales and
  Northern Ireland, the scheme will improve our understanding of the role of badgers in the
  epidemiology of bovine TB. It will initially focus on five counties in the High-Risk Area of
  England.
