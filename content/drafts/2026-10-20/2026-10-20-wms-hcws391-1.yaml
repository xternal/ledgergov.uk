  title: Entitlement for Offenders Detained in Hospital
  date: "2026-10-20"
  venue_label: Written ministerial statement
quote: >-
  The regulations will remove entitlement from individuals convicted of specified serious offences
  and with either a section 37 order under the Mental Health Act 1983 or a section 57A order under
  the Criminal Procedure (Scotland) Act 1995. It will apply to claimants in receipt of one of four
  benefits; Universal Credit, Employment and Support Allowance, State Pension and Pension Credit.
