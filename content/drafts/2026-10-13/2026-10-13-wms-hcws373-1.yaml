  date: "2026-10-13"
  venue_label: Written ministerial statement
quote: >-
  The Foreign, Commonwealth and Development Office (FCDO) proposes to increase the United Kingdom’s
  callable capital commitment to the African Development Bank (AfDB) as part of the General Callable
  Capital Increase agreed by shareholders in 2024 (GCCI 2024). This will result in an additional
  contingent liability of approximately £1.6 billion, reflecting the UK’s 1.87% share of the total
  increase.
