  date: "2026-11-18"
  venue_label: Consultation outcome (Ministry of Housing, Communities and Local Government)
quote: >-
  The government intends to lay the general safety requirement (GSR) regulations in 2027, with the
  new requirements coming into force no earlier than 12 months later. This approach will provide
  time for preparation and support effective implementation of the new regime. The GSR will close
  gaps in the current regulatory system by creating a safety duty for construction products not
  covered by a designated standard, or subject to a technical assessment.
