  title: "Regulation of leasehold: service charges, litigation costs and insurance costs"
  date: "2026-11-12"
  venue_label: Written ministerial statement
quote: >-
  From 1 November 2027, commission-sharing with landlords and managing agents will be banned and
  replaced with transparent permitted insurance payments. This will ensure leaseholders are only
  charged for specific insurance-related services provided to them by their landlord or managing
  agent, thereby preventing the cost of excessive commissions being passed on.
