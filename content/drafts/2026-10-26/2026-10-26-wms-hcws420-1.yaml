quote: >-
  The Fiscal Devolution Roadmap and the Rewiring the State Delivery plan will further set out how
  Good Growth Funds fit within our wider plans to give back control to local leaders, beginning with
  the retention of a share of business rates from April 2027 and income tax assignment for Mayors
  from April 2028.
