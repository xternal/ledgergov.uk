quote: >-
  Our immediate commitment is to offer everyone sleeping rough a route off the streets this
  Christmas and to bring forward new accommodation and the right support to help people move ahead
  with their lives. We are backing that commitment with an extra £432 million from next year, so
  that local areas can continue to provide a route off the streets over the rest of this Parliament.
