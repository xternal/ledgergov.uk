  title: Melt and Pour Reporting Requirement for Steel
  date: "2026-11-16"
  venue_label: Written ministerial statement
quote: >-
  Today, I am announcing that the Government will introduce a melt and pour reporting requirement
  for steel products within the scope of the UK’s steel trade measure. The requirement will begin on
  a voluntary basis from 1 April 2027 and become mandatory from 1 July 2027.
