  - quote: >-
      As announced at Budget 2026, the government will introduce legislation that will enable
      individuals who start receiving a pension under a RCPS to convert that pension to a drawdown
      pension within a set period, if the RCPS chooses to provide that option under their scheme
      rules. The government is minded to allow a period of up to one year in which a member may
      convert their RCPS pension to flexi-access drawdown.
