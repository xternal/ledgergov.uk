quote: >-
  That is why today, my Right Honourable Friend the Economic Secretary to the Treasury (Rt Hon Lucy
  Rigby KC MP) and I are announcing that we will legislate to finally end this injustice to create a
  new scheme to allow easier access to Child Trust Funds once the account holder turns 18, so that
  young people lacking mental capacity can easily benefit from the money in their accounts.
