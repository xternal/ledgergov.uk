  title: Government action so children do not pay for a parent’s crime
  date: "2026-11-25"
  venue_label: Press release (Ministry of Justice)
quote: >-
  A new scheme launching this summer will join up information held across public services –
  including prisons, police and local councils. This will mean, for the first time, police forces
  will share information with local authorities in targeted areas about parents who have gone into
  prison, and government will bring together existing data to share it with local authorities,
  meaning children and families get the vital support to health, education and social services.
