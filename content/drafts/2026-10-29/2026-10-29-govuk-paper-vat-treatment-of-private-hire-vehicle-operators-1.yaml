  title: VAT treatment of private hire vehicle operators
  date: "2026-10-29"
  venue_label: Policy paper (HM Revenue & Customs)
quote: >-
  This measure announces a change in VAT law coming into effect in January 2028 for supplies of
  passenger transport services by taxi or PHV supplied through an agent, so that the services will
  be deemed to be made by the agent and not the driver. This means that the operator will account
  for VAT on the full value of the fare where they are registered for VAT.
