quote: >-
  In particular, we will introduce a new requirement for existing trustee boards to approve any
  transition to a PCST model proposed by the sponsoring employer, in line with these criteria, and
  for a resolution process if the existing trustee board reject the proposal made by the sponsoring
  employer.
