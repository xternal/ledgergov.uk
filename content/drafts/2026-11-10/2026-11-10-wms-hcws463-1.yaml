quote: >-
  On 9 November, the Prime Minister and the Secretary of State for Health and Social Care announced
  that £40 million of funding will be reinvested in general practice to help GPs proactively
  identify and support up to 300,000 vulnerable patients this winter. This ring-fenced funding will
  help keep people well at home, prevent serious illness and reduce avoidable hospital admissions as
  we strengthen preparations for extra pressure on the NHS over winter.
