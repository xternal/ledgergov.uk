quote: >-
  Drivers will get new rights to challenge unfair private parking charges under new rules announced
  today. This includes a guaranteed 5 minutes to decide whether to park and 10 minutes to leave once
  their session ends, and the right to have charges cancelled on appeal for issues they can’t
  control.
