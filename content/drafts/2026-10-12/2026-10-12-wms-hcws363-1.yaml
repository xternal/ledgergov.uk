quote: >-
  On 26 September, the government announced that a new equity loan scheme, Your First Home, will be
  confirmed at this month’s Budget, to support more people into homeownership. The scheme will
  enable prospective first-time buyers who can't rely on help from the bank of Mum and Dad to
  purchase a new-build home from a participating housebuilder with a 2.5% deposit, supported by a
  20% government-backed equity loan.
