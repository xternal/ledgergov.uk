quote: >-
  To help households with the rising cost of energy, the government will provide a £100 Household
  Energy Payment for households in council tax bands A to D for this year. This will be paid
  directly into bank accounts where possible from January, giving up to 20 million households in
  England some breathing space from rising energy prices.
