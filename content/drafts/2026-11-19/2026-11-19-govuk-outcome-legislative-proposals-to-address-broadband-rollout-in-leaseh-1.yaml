quote: >-
  Following consultation and further policy development, the government intends to legislate through
  the Commonhold and Leasehold Reform Bill. The legislation will imply terms into certain leases,
  giving requesting tenants of flats a clear, enforceable and time-bound route to request the
  deployment of gigabit-capable broadband to their building and obtain a properly evidenced response
  confirming whether deployment is technically possible in the building.
