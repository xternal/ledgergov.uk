  venue_label: Consultation outcome (Ministry of Housing, Communities and Local Government)
quote: >-
  As we have set out in this UK government response, it is intended that the ban on the use of
  leasehold for new flats, subject to defined exemptions, will commence two and a half years after
  the commonhold regulations come into force, and we will work with consumers and industry to ensure
  a smooth transition. The ban will therefore commence in approximately 2031.
