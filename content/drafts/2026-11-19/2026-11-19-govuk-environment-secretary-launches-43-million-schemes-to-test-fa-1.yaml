quote: >-
  Applications for the Water Management Grant, announced by the Prime Minister in the summer, will
  open on November 30, helping farmers invest in reservoirs and storage to secure supplies during
  dry periods, with the latest Farming Innovation Programme competition aiming to protect soil
  health and improve water quality.

  The application window for the Water Management Grant will remain open for 12 weeks to 23 February
  2027 and will not operate on a first-come, first-served basis, meaning an application submitted on
  the closing day has the same chance of receiving funding as if it were submitted on the opening
  day.
