quote: >-
  The Government intends to introduce a new statutory framework for use of biometrics, facial
  recognition, and similar technologies by law enforcement and other public bodies. This framework
  will include specific powers and obligations for those authorised to use these technologies and it
  will ensure policing can innovate in a repeatable and consistent manner, supporting adoption of
  emerging biometric and overt surveillance technologies that improve policing effectiveness and
  public protection, while maintaining appropriate safeguards and oversight. The framework will also
  establish a new independent oversight body, which will consolidate and expand the functions of
  existing oversight roles and have powers to monitor compliance and enforce standards.
