quote: >-
  We will legislate to introduce a mandatory human rights due diligence regime across the UK for
  services, and in Great Britain for goods. Only the largest businesses, with the capability and
  leverage to manage these risks within their supply chains, will be in scope. It will apply to UK
  businesses with a global turnover of over £350 million, as well as non-UK businesses with a
  UK-generated turnover of over £350 million.
