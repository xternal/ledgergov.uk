  title: Law enforcement use of biometrics, facial recognition and similar technologies
  date: "2026-11-04"
  venue_label: Written ministerial statement
quote: >-
  That is why the Police Reform Bill will introduce a new framework to underpin use of biometric and
  overt surveillance systems for law enforcement and some safeguarding purposes, by the police and
  other public bodies. The framework will ensure policing can innovate in a repeatable and
  consistent manner, supporting adoption of emerging biometric and overt surveillance technologies
  that improve policing effectiveness and public protection. New powers will be supported by a
  statutory Code of Practice, and a new independent oversight body will monitor and enforce
  compliance.
