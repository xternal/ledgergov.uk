quote: >-
  At the Joint Committee, we will be signing a Joint Declaration with the EU. The effect of this
  will be to ensure that “not at risk” parcels, i.e. those sent to consumers in Northern Ireland
  moving under the Windsor Framework facilitation schemes, will not be impacted by the recently
  introduced ‘handling fee’ in the EU ensuring they pay no fees or charges.
